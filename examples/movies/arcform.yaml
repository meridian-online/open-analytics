# The `movies` demo Protocol — a reproducible recipe for a dashboard's worth of data.
#
# NOTHING HERE IS PUBLISHED. This Protocol references a third-party URL and builds a
# local Parquet. Meridian hosts none of it, and no step in this file writes to
# openlake. That is the whole difference between `examples/` and `datasets/`: a
# manifest under `datasets/` terminates in an object Meridian serves, and a manifest
# under `examples/` terminates on the disk of whoever ran it. See ../README.md.
#
# WHY THE URL IS PINNED BY HASH, AND WHAT THE PIN DOES NOT DO. On a real transfer
# `http_fetch`'s `sha256:` fails closed: bytes that do not match are refused rather
# than built on, checked here by corrupting a pin against an empty cache and watching
# the run stop. **On a shared-cache HIT it is not consulted at all.** The cache is
# keyed by URL, so once this URL has been fetched on a machine, a manifest declaring
# `sha256: 0000…0` builds to exit 0 and reuses the cached bytes — reproduced here.
# The pin therefore protects the FIRST fetch on a cold machine and is decorative
# afterwards. Treat it as provenance rather than as an integrity gate until arcform
# consults it on the cache path. The hash below was computed from the bytes, not
# copied from another project's source comment.
#
# Produces: build/movies.parquet + datapackage.json
name: movies
engine: duckdb
engine_version: ">=1.2"
db: build/movies.db

defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  - name: fetch_movies
    op: http_fetch@1
    with:
      url: https://cdn.jsdelivr.net/npm/vega-datasets@3.2.1/data/movies.json
      out: build/movies.json
      sha256: e63c499759e3b07b49563e036f55290f87feb56def8703ec049ca305ab1523d3
      headers:
        User-Agent: "Meridian Protocol (open-analytics demo; research@meridian.online)"

  - name: load
    sql: models/load.sql
    depends_on: [build/movies.json]
    produces: [movies]

  # ORDER BY ALL is what makes the bytes reproduce. It is not a TOTAL order — two rows
  # equal in every column tie — but a tie between rows that are equal in every column
  # cannot change the bytes, because the rows themselves are identical. A total order
  # is sufficient for determinism, not necessary; this is the weaker condition that
  # actually holds, and it holds without inventing a surrogate key.
  - name: export_movies
    op: parquet_export@1
    with:
      input: movies
      dest: build/movies.parquet
      compression: zstd
      order_by: "ALL"

  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/movies.parquet
      overrides: descriptor.overrides.json
      out: datapackage.json
