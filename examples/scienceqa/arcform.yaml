# The `scienceqa` demo Protocol — 4,241 multiple-choice science questions, as a recipe.
#
# NOTHING HERE IS PUBLISHED. This Protocol references a third-party URL and builds a
# local Parquet. Meridian hosts none of it, and no step writes to openlake. See
# ../README.md for why `examples/` and `datasets/` are different things.
#
# NON-COMMERCIAL RESTRICTION — READ THIS BEFORE THE OUTPUT GOES ANYWHERE.
# The licensor (Pan Lu et al., "Learn to Explain: Multimodal Reasoning via Thought
# Chains for Science Question Answering", NeurIPS 2022) publishes ScienceQA under
# CC BY-NC-SA 4.0 — Attribution-NonCommercial-ShareAlike — stated on the project site
# (scienceqa.github.io) and in the README of the authors' repository
# (github.com/lupantech/ScienceQA), whose files this Protocol reads. That licence
# does NOT block this Protocol existing or running: referencing a URL someone may
# lawfully fetch is not redistribution, which is the whole basis on which every
# Protocol in this directory stands. It DOES block one thing downstream — running
# this and looking at the result are different acts, and only the second is
# restricted:
#   the output of this Protocol — the Parquet, any chart or figure built from it, any
#   number pulled out of it — MUST NOT appear anywhere Meridian sells, markets or
#   prices: not the site, not launch material, not a pricing page. Non-commercial
#   means Meridian's own commercial use of the OUTPUT, not the act of building it.
#
# WHY IT READS THE AUTHORS' FILE AND NOT A MIRROR. This Protocol first fetched the
# test split from a third party's Hugging Face mirror, derek-thomas/ScienceQA. A
# Protocol Meridian maintains reads the authors' own files: a mirror can change,
# vanish or carry a different licence from the authors', and this one already did
# the last. Its YAML frontmatter tags the dataset `cc-by-sa-4.0`, with no
# NonCommercial clause, and a third-party gallery that read only that tag has
# recorded the dataset as plain CC BY-SA. The mirror's own card body says CC BY-NC-SA
# 4.0, and so do the licensor's site and repository. A mirror's tag is not the
# licensor; verify against the licensor's own words, every time, and this dataset is
# the recorded instance of why. The authors' test split is the mirror's, row for row:
# the 4,241 rows this recipe builds from each are the same multiset on every column
# it keeps, and with the same arc and DuckDB the two recipes export a byte-identical
# Parquet.
#
# THE AUTHORS' REPOSITORY CARRIES TWO LICENCES. GitHub labels it MIT, which its
# README gives for the code; the same README licenses "the ScienceQA dataset" under
# CC BY-NC-SA 4.0. The data's licence is the second, for the same reason a mirror's
# tag is not the licensor: a code repository's licence is not a grant over the data
# it holds.
#
# WHY THIS PROTOCOL NEEDS NOTHING NEW. It declares no precomputed projection or
# embedding columns, so `http_fetch`, `parquet_export` and `datapackage_describe`
# are the whole of it — the same three operators the other three demo Protocols
# already exercise.
#
# WHICH SPLIT, AND WHY. The authors publish all three splits in one file,
# `data/scienceqa/problems.json` (31.5 MB), each question tagged `train` (12,726),
# `val` (4,241) or `test` (4,241). This Protocol keeps only `test`: it is the split
# the dataset's own leaderboard scores against, so it is the most standard slice to
# point at, and it is tied for the smallest of the three. The fetch still carries the
# other two splits, because the authors publish no file of the test split alone.
#
# WHY THE `image` COLUMN IS NOT IN THE OUTPUT. The source names each question's
# figure — always `image.png`, present for 2,017 of these 4,241 rows and NULL for
# the rest — and ships the pictures themselves as separate image downloads, which
# this Protocol does not fetch: no chart in the analysis surface renders them.
# `load.sql` reduces the field to a boolean `has_image` instead, which is the fact a
# dashboard can use.
#
# WHY THE URL IS PINNED BY REVISION AND BY HASH. The URL addresses a 40-character
# commit of the authors' GitHub repository rather than its default branch, so the
# revision is pinned as well as the bytes. On a real transfer `http_fetch`'s
# `sha256:` fails closed — corrupt a pin against an empty cache and the run stops,
# naming both hashes, checked here the same way ../movies/arcform.yaml documents.
# On a shared-cache HIT it is not consulted at all: the cache is keyed by URL, so a
# manifest declaring `sha256: 0000…0` against an already-warm cache builds to exit 0.
# Treat the pin as provenance, not as an integrity gate that holds on every machine.
#
# Produces: build/scienceqa.parquet + datapackage.json
name: scienceqa
engine: duckdb
engine_version: ">=1.2"
db: build/scienceqa.db

defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  - name: fetch_scienceqa
    op: http_fetch@1
    with:
      url: https://raw.githubusercontent.com/lupantech/ScienceQA/2cbf8318e07b9ece895bb2ae605e71e38d623264/data/scienceqa/problems.json
      out: build/scienceqa.src.json
      sha256: 4d9b598da966d9736dd79e430a97da861a2216aeb7483a5092350e823ab20ce7
      headers:
        User-Agent: "Meridian Protocol (open-analytics demo; research@meridian.online)"

  - name: load
    sql: models/load.sql
    depends_on: [build/scienceqa.src.json]
    produces: [scienceqa]

  # ORDER BY ALL is what makes the bytes reproduce, for the same reason
  # ../movies/arcform.yaml and ../census-income/arcform.yaml give it: 64 of these
  # 4,241 rows are exact duplicates of another row on every retained column, so the
  # ordering is not a TOTAL order. It is still deterministic in bytes, because the
  # only rows it leaves unordered relative to each other are rows identical in every
  # column — a tie between identical rows cannot change the output.
  - name: export_scienceqa
    op: parquet_export@1
    with:
      input: scienceqa
      dest: build/scienceqa.parquet
      compression: zstd
      order_by: "ALL"

  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/scienceqa.parquet
      overrides: descriptor.overrides.json
      out: datapackage.json
