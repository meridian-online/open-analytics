# Pull-request checks. Every job on this page reads the repository and fixtures, and
# none reads the open lake. Descriptors are not committed: the lake stores each table's
# descriptor, and the checks that read it run in two other places.
#
#   Before a publish, in the Protocol's own Run. `check_before_publish.py` holds the
#   built descriptor to the built Parquet (fields, types, constraints, key, bytes,
#   self-description, licence, licence notice), puts it through Frictionless, holds its
#   labels to every other table's in the lake with label agreement `--strict`, and runs
#   the constraint ratchet on it against the overrides sidecar (see below). A
#   refusal stops the Run before anything is written. A code-list Protocol also runs
#   `check_code_list.py` on its built file.
#
#   After a publish, in `lake.yml` (weekly and on demand, never on a push). It emits every
#   stored descriptor and runs over them the descriptor check with the README catalogue,
#   the engine pin, label agreement, Frictionless, the code-list contract, the declared
#   joins, the constraint ratchet against HEAD's overrides, and a full re-hash of every
#   served object. The lake contradicting itself is drift: the run fails and opens an
#   alert issue. A finding against a repository input is reported, in the weekly report
#   issue, as main disagreeing with the lake or as awaiting publish, and fails nothing.
#   `scripts/lake_check.py` says how each is sorted.
#
#   The ratchet's other half is refused in the Run by `check_before_publish.py`, where
#   a descriptor is regenerated now: a built descriptor that lost a constraint the
#   sidecar held when the lake's table was published (the sidecar at the last commit
#   before its `created`), unless HEAD's sidecar declares the new value. A pull request
#   that only edits overrides is refused by nothing, as before.
#
# What stays here is what can be judged without the lake, and it is mostly self-tests.
# Each builds scratch inputs with a deliberate disagreement and asserts the exit status
# and the message, so a check that runs elsewhere is known to be able to fail:
# `self-test` for the descriptor check, `engine-version-self-test` for the engine pin and
# the lake's shape rule, `join-self-test` for declared joins, `code-list-self-test`,
# `label-agreement-self-test`, `constraint-ratchet-self-test`, `frictionless-self-test`,
# `before-publish-self-test` for the check a Run makes before it publishes,
# `emit-descriptor-self-test` for the emitter, and `lake-check-self-test` for how the
# lake check sorts what it finds. Two families of reasons outlive the jobs that moved:
#
#   A descriptor is stamped into the footer of the object it describes and declares that
#   object's sha256, so correcting a published declaration is a republish. That is why
#   `datasets/label-agreement.json` records stated reasons and corrections, and
#   `datasets/frictionless-rejections.json` known refusals, that close or adjudicate a
#   difference rather than edit it away: each entry pins the exact values it covers, so
#   a stale entry fails the check as surely as an unexplained difference does.
#
#   The engine that WROTE a published object and the engine PINNED to judge it can be
#   different versions, and a byte comparison cannot tell that from a data defect. The
#   engine check reads the footer's `created_by` and names both versions.
#
# The shipped `examples/` keep their descriptors, and the licence rule is the only rule
# that reads them; `self-test` holds every shipped example to it.
#
# `ingest-self-test` runs the crosswalk's SQL models against scratch sources and asserts
# that an identifier failing ISO 7064 MOD 97-10 stops the run; one case deletes the
# filter from the shipped model and asserts the gate reddens.
#
# `stamp-self-test` and `description-needs-no-repository` cover the surface a consumer
# reads. A published Parquet carries its own descriptor in its footer, so someone
# holding an object URL can ask the file what it is. The first proves the stamp lands,
# survives, leaves every data byte where it was, and is refused when it does not. The
# second blackholes `github.com` and `raw.githubusercontent.com` in `/etc/hosts`,
# watches the old path (fetching `datapackage.json` out of the repository) stop
# working, and asserts an object served from loopback still answers. It refuses to run,
# exit 2, while a repository host is still reachable. It reads no lake object, which is
# why it stays on pull requests rather than moving to lake.yml.
#
# `protocol-readme-self-test` and `protocol-readme` read `arcform.yaml` as YAML and hold
# each README's step list to its manifest. The manifest is PARSED, never grepped:
# `grep -c 'command:' datasets/edgar_gleif/arcform.yaml` is 4 with no `command:` step.
#
# `arc-manifest-load-self-test` and `arc-manifest-load` ask `arc` itself.
# `scripts/arc_manifest_load` links `arc`'s spec loader, `arc::spec::Manifest::load`, at
# `ARC_REV` below, hands it every `arcform.yaml` under `datasets/` and `examples/`, and
# fails on a refusal with the loader's own message, unedited. The walk prints how many
# manifests it loaded and refuses fewer than four under `datasets/`, eleven under
# `examples/` or fifteen in all, because a walk over an emptied subtree otherwise reads
# like full coverage.
#
# WHAT `arc-manifest-load` DOES NOT COVER. `Manifest::load` judges one document in
# isolation. A `depends_on:` naming a step that does not exist loads, and `arc` runs it,
# resolving the name as an external file source. A `sql:` step's model is never opened,
# so a missing or broken one passes. The self-test pins both as accepted, so the day the
# loader refuses either, a test reddens and this paragraph is due for an edit. Running
# the pipeline is `protocol-tests`' job, on fixtures, for the Protocols with a tests.yaml.
#
# `publish-seam` holds `publish_dataset.py` to declaring what it uploaded, against a
# scratch HTTP object store and scratch Run records.
name: descriptors

on:
  push:
    branches: [main]
  pull_request:
  # No schedule: nothing here reads what a publish can change. lake.yml runs weekly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: descriptors-${{ github.ref }}
  cancel-in-progress: true

env:
  # The DuckDB every job below installs to run its own checks. lake.yml carries the same
  # literal, as the reader's pin and the fallback for a Protocol that pins no DuckDB; its
  # engine check holds each published footer's `created_by` to its own Protocol's stamp
  # pin, the one writer statement that travels with the bytes, rather than comparing
  # literals. Bump the two files together.
  DUCKDB_VERSION: "2.0.0"
  PYTHON_VERSION: "3.12"
  # `arcform.yaml` is read as YAML by scripts/check_protocol_readme.py. Pinned for the
  # same reason every other version on this page is: a resolver picking the version of
  # the day makes what ran a property of the day rather than of this file.
  PYYAML_VERSION: "6.0.3"
  # The SOC 2018 models' self-test edits its BLS fixture workbooks with openpyxl.
  OPENPYXL_VERSION: "3.1.5"
  # The reference Frictionless implementation, which `before-publish-self-test` and
  # `frictionless-self-test` load; lake.yml carries the same literal. This literal is NOT reconciled against
  # `datasets/frictionless-rejections.json`'s `frictionless_version` by comparing the
  # two files: `check_frictionless.py` compares the rejections file against the version
  # that is actually IMPORTED at check time, so a bump here with no re-measurement there
  # exits 2 and names both versions. Two literals, and the one that decides is the
  # runtime.
  FRICTIONLESS_VERSION: "5.19.0"
  # The `arc` revision `arc-manifest-load` links, by git rev because `arc` has no
  # release channel. brightfield loads these same manifests through its own `arc`, and
  # two pins that drift can give two answers to whether a manifest is valid; this one is
  # ahead of brightfield's because every Protocol here sets `ducklake_write@1`'s
  # `on_descriptor_change`, which older revisions refuse. It is also the `arc` that
  # `protocol-tests` builds, and a publisher's `arc` must be this revision or later. scripts/arc_manifest_load/Cargo.toml carries the rev once and says how to
  # move all three literals together; `arc-manifest-load` refuses a Cargo.lock whose
  # arcform sources are not all at this rev, and `--locked` refuses a Cargo.toml the lock
  # does not match.
  ARC_REV: "7032be2f1592c73589a05bccf12f5fb312d731d0"
  # The toolchain and the DuckDB C library arcform's own CI builds `arc` with at
  # `ARC_REV`, and they move with it. The loader calls no DuckDB function; it links the
  # library because `arc` does. This is a separate literal from `DUCKDB_VERSION`, which
  # is the Python reader's pin, so bumping one does not move the other.
  ARC_RUST_TOOLCHAIN: "1.94"
  # What `protocol-tests` runs a Protocol's tests.yaml with, beside `arc` at ARC_REV: the
  # finetype release whose binary and DuckDB extension the describe and validate steps
  # load (0.6.67, the version every published descriptor records), the `uv` that runs the
  # uv@1 steps, and DuckDB's command line, which `arc test` runs a break's SQL on.
  FINETYPE_VERSION: "0.6.67"
  UV_VERSION: "0.13.8"
  ARC_LIBDUCKDB_VERSION: "v2.0.0"

jobs:
  self-test:
    name: the check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: scratch fixtures, exit status and message
        run: python scripts/test_check_descriptors.py

  stamp-self-test:
    name: an object can carry its own description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: the stamp lands, the data does not move, the read asks for one URL
        run: python scripts/test_stamp_descriptor.py

  emit-descriptor-self-test:
    name: a descriptor is emitted from the lake and the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb and pyyaml
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}" "pyyaml==${PYYAML_VERSION}"
      - name: the descriptor round-trips, a missing entry is refused, the tree is laid out
        run: python scripts/test_emit_descriptor.py

  before-publish-self-test:
    name: the check a Protocol runs before it publishes can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb, pyyaml and frictionless
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}" "pyyaml==${PYYAML_VERSION}" "frictionless==${FRICTIONLESS_VERSION}"
      - name: built tables against a scratch lake, exit status and message
        run: python scripts/test_check_before_publish.py

  description-needs-no-repository:
    name: the description comes back with the repository blocked
    needs: stamp-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      # Fetched BEFORE the blackhole and cached, so the demonstration below needs no
      # host but the loopback object server. An extension downloaded mid-test would be
      # a read outside the object URL, which is the thing being disproved.
      - name: cache the httpfs extension while the network is whole
        run: python -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL httpfs'); c.execute('LOAD httpfs')"
      # After checkout, necessarily: the checkout itself comes from the host being
      # blocked. Everything the job still needs is already on disk.
      - name: put the repository out of reach
        run: |
          echo "0.0.0.0 github.com raw.githubusercontent.com" | sudo tee -a /etc/hosts
      - name: the old path dies and the object still answers
        run: python scripts/test_self_description_needs_no_repository.py

  engine-version-self-test:
    name: the engine-version check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: scratch footers, exit status and message
        run: python scripts/test_check_engine_version.py
      - name: lake shape rule and CLI against a scratch DuckLake
        run: python scripts/test_check_lake_shape.py

  ingest-self-test:
    name: the ingest refuses an identifier that names nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: the shipped models, against scratch sources
        run: python datasets/edgar_gleif/scripts/test_ingest_lei.py

  join-self-test:
    name: the join runner can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: scratch packages, exit status and message
        run: python datasets/edgar_gleif/scripts/test_crosswalk_join.py

  one-writer-per-file:
    name: a restructured Protocol declares each file it writes once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install pyyaml
        run: python -m pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"
      - name: the manifests, and a scratch one that shares a path
        run: python scripts/test_manifest_one_writer.py

  registry-agrees-with-itself:
    name: the registry's addresses, namespaces and reserved names agree
    # `datasets/registry.json` states its address rules in prose and carries the same rules
    # as data. Nothing else on this page reads it, so an address (an entry's `moves_to`, or its
    # `schema` and `name`) in a namespace the registry does not list, or a
    # namespace that is not reserved, would pass every job here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: the shipped registry, and scratch ones that each break a rule
        run: python scripts/test_registry.py

  protocol-readme-self-test:
    name: the step-list check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install pyyaml
        run: python -m pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"
      - name: scratch manifests, exit status and message
        run: python scripts/test_check_protocol_readme.py

  protocol-readme:
    name: every README's step list is its manifest's
    needs: protocol-readme-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install pyyaml
        run: python -m pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"
      - name: every datasets/*/README.md against the manifest beside it
        shell: bash
        run: |
          set +e
          python scripts/check_protocol_readme.py > protocol-readme.log 2>&1
          status=$?
          set -e
          cat protocol-readme.log
          {
            echo '### README step list vs manifest'
            echo
            echo '```'
            cat protocol-readme.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  arc-manifest-load-self-test:
    name: the manifest-load check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.ARC_RUST_TOOLCHAIN }}
      # One cache for both jobs: the self-test's `cargo test` builds the gate binary in
      # the same profile the gate job runs it from.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/arc_manifest_load
          shared-key: arc-manifest-load
      # `arc` links a system DuckDB, so the C library is fetched as arcform's own CI
      # fetches it and the linker, the bindings build script and the runtime are pointed
      # at it.
      - name: install libduckdb
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/libduckdb.tar.gz" \
            "https://github.com/duckdb/duckdb/releases/download/${ARC_LIBDUCKDB_VERSION}/duckdb-shared-libs-linux-amd64.tar.gz"
          mkdir -p "$HOME/libduckdb"
          tar -xzf "$RUNNER_TEMP/libduckdb.tar.gz" -C "$HOME/libduckdb"
          {
            echo "DUCKDB_LIB_DIR=$HOME/libduckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/libduckdb"
            echo "LD_LIBRARY_PATH=$HOME/libduckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
      - name: scratch trees, exit status and message
        working-directory: scripts/arc_manifest_load
        run: cargo test --locked

  arc-manifest-load:
    name: every manifest loads through arc's own loader
    needs: arc-manifest-load-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.lock links arcform at ARC_REV and nowhere else
        shell: bash
        run: |
          set -euo pipefail
          lock=scripts/arc_manifest_load/Cargo.lock
          sources=$(grep -E '^source = "git\+https://github\.com/meridian-online/arcform' "$lock" || true)
          if [ -z "$sources" ]; then
            echo "::error::$lock names no arcform source, so no arc revision is linked"
            exit 1
          fi
          stray=$(grep -vF "?rev=${ARC_REV}#${ARC_REV}\"" <<<"$sources" || true)
          if [ -n "$stray" ]; then
            echo "::error::$lock links arcform at a revision other than ARC_REV=${ARC_REV}"
            echo "$stray"
            exit 1
          fi
          echo "every arcform source in $lock is at ${ARC_REV}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.ARC_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/arc_manifest_load
          shared-key: arc-manifest-load
      - name: install libduckdb
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/libduckdb.tar.gz" \
            "https://github.com/duckdb/duckdb/releases/download/${ARC_LIBDUCKDB_VERSION}/duckdb-shared-libs-linux-amd64.tar.gz"
          mkdir -p "$HOME/libduckdb"
          tar -xzf "$RUNNER_TEMP/libduckdb.tar.gz" -C "$HOME/libduckdb"
          {
            echo "DUCKDB_LIB_DIR=$HOME/libduckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/libduckdb"
            echo "LD_LIBRARY_PATH=$HOME/libduckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
      - name: build the loader
        working-directory: scripts/arc_manifest_load
        run: cargo build --locked
      - name: every datasets/ and examples/ manifest through Manifest::load
        shell: bash
        run: |
          set +e
          scripts/arc_manifest_load/target/debug/arc-manifest-load "$GITHUB_WORKSPACE" > arc-manifest-load.log 2>&1
          status=$?
          set -e
          cat arc-manifest-load.log
          {
            echo "### Every manifest through arc's loader at \`${ARC_REV}\`"
            echo
            echo '```'
            cat arc-manifest-load.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  label-agreement-self-test:
    name: the cross-package check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: scratch packages, exit status and message
        run: python scripts/test_check_label_agreement.py

  # Each Protocol with a tests.yaml, run by `arc test` at ARC_REV: its real steps against
  # the fixture files committed beside it, with no network for data and no publish. A
  # test asserts the run succeeds with its inline checks returning no rows, or fails with
  # the loader's own message, and arc reruns every break without its change to show the
  # failure comes from it. This replaces a Python self-test of the models for the
  # Protocols that have one. The JUnit file is uploaded, and the summary lists each test.
  protocol-tests:
    name: each Protocol's tests.yaml passes under arc test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol: [fips, ourairports, naics, naics_2022_titles, naics_2017_to_2022, edgar_gleif]
    steps:
      - uses: actions/checkout@v4
        with:
          # check_before_publish reads the overrides at the last commit before the lake's created, so a shallow clone exits 2.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.ARC_RUST_TOOLCHAIN }}
      # The built arc, by revision and toolchain, so a run at the same ARC_REV skips the
      # compile. libduckdb is installed on every run, since arc links it at run time.
      - id: arc-cache
        uses: actions/cache@v4
        with:
          path: ~/arc
          key: arc-${{ env.ARC_REV }}-rust-${{ env.ARC_RUST_TOOLCHAIN }}-libduckdb-${{ env.ARC_LIBDUCKDB_VERSION }}
      - name: install libduckdb and the DuckDB command line
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/libduckdb.tar.gz" \
            "https://github.com/duckdb/duckdb/releases/download/${ARC_LIBDUCKDB_VERSION}/duckdb-shared-libs-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/duckdb-cli.tar.gz" \
            "https://github.com/duckdb/duckdb/releases/download/${ARC_LIBDUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz"
          mkdir -p "$HOME/libduckdb" "$HOME/duckdb-cli"
          tar -xzf "$RUNNER_TEMP/libduckdb.tar.gz" -C "$HOME/libduckdb"
          tar -xzf "$RUNNER_TEMP/duckdb-cli.tar.gz" -C "$HOME/duckdb-cli"
          {
            echo "DUCKDB_LIB_DIR=$HOME/libduckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/libduckdb"
            echo "LD_LIBRARY_PATH=$HOME/libduckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          echo "$HOME/duckdb-cli" >> "$GITHUB_PATH"
      - name: install finetype, its DuckDB extension and uv
        run: |
          set -euo pipefail
          base="https://github.com/meridian-online/finetype/releases/download/v${FINETYPE_VERSION}"
          name="finetype-v${FINETYPE_VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "$HOME/finetype"
          cd "$HOME/finetype"
          for f in "$name.tar.gz" "$name.duckdb_extension"; do
            curl -fsSL -o "$f" "$base/$f"
            curl -fsSL -o "$f.sha256" "$base/$f.sha256"
            echo "$(awk '{print $1}' "$f.sha256")  $f" | sha256sum -c -
          done
          tar -xzf "$name.tar.gz"
          # DuckDB takes an extension's entry point from its file name, up to the first
          # dot, so the release asset is loaded under the name finetype.duckdb_extension.
          cp "$name.duckdb_extension" finetype.duckdb_extension
          echo "$HOME/finetype" >> "$GITHUB_PATH"
          echo "FINETYPE_DUCKDB_EXT=$HOME/finetype/finetype.duckdb_extension" >> "$GITHUB_ENV"
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | env UV_INSTALL_DIR="$HOME/uv" sh
          echo "$HOME/uv" >> "$GITHUB_PATH"
      - name: build arc at ARC_REV
        if: steps.arc-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/meridian-online/arcform \
            --rev "${ARC_REV}" --bin arc --root "$HOME/arc"
      - name: put arc on PATH
        run: echo "$HOME/arc/bin" >> "$GITHUB_PATH"
      # Run east of UTC: GitHub's runners are on UTC, so a Protocol that reads a UTC
      # timestamp as local time would pass there. OurAirports' "a commit late in the UTC
      # day takes its UTC date" test fails under this zone if the release date is read
      # in local time, and only then.
      - name: arc test
        working-directory: datasets/${{ matrix.protocol }}
        shell: bash
        env:
          TZ: Pacific/Auckland
        run: |
          set +e
          arc --version
          finetype --version
          duckdb --version
          arc test --junit "$RUNNER_TEMP/${{ matrix.protocol }}-junit.xml" > "$RUNNER_TEMP/arc-test.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/arc-test.log"
          {
            echo "### \`arc test\` in datasets/${{ matrix.protocol }} at \`${ARC_REV}\`"
            echo
            echo '```'
            cat "$RUNNER_TEMP/arc-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: upload the JUnit file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-test-${{ matrix.protocol }}
          path: ${{ runner.temp }}/${{ matrix.protocol }}-junit.xml
          if-no-files-found: ignore

