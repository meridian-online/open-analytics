# Reads every published descriptor back against the Parquet it describes.
#
# `self-test` runs first and proves the check can fail: it builds scratch datasets
# with deliberate descriptor/bytes disagreements and asserts both the exit status
# and the message. `descriptors-match-their-data` then runs the same check against
# the live published files, and is only meaningful because the job above it passed.
#
# `engine-version-self-test` and `engine-version-matches-the-pin` cover a different
# way a descriptor check can be wrong without the data being wrong at all: the engine
# that WROTE a published object and the engine PINNED to judge it can be different
# versions. A byte/hash comparison has no way to tell that apart from a real data
# defect, and one shipped exactly that way — a version skew was reported as a
# disagreement between descriptor and data, and the refusal it caused was resolved
# by hand. The Parquet footer's own `created_by` field names the engine that wrote
# it, so `engine-version-matches-the-pin` reads that back for every published
# resource and holds it to `DUCKDB_VERSION` below, naming both versions when they
# differ and saying plainly that the disagreement is about engines, not data.
# `engine-version-self-test` proves it first, the same way the pair above does: on a
# scratch footer it patches byte-for-byte to disagree, and on one it leaves alone.
#
# `ingest-self-test` sits one step earlier in the chain — not on a published object but
# on what may enter one. It runs the crosswalk's own SQL models against scratch sources
# and asserts that an identifier failing ISO 7064 MOD 97-10, which GLEIF does not
# publish, stops the run instead of shipping as an identity edge. It is a self-test in
# the same sense as the job above: one case deletes the filter from the shipped model
# and asserts the gate behind it reddens.
#
# The join pair below it does the same for the relationships BETWEEN packages.
# `schema.foreignKeys` can only say a reference is total, so a partial one is
# declared under `x-joins` instead — and a relationship no one executes is a
# relationship no one can trust. `the join runner can fail` builds scratch packages
# with deliberately wrong coverage figures and asserts the exit status and message;
# `declared joins run` then runs the real declarations against the published
# objects. Same order and same reason as the pair above.
#
# `stamp-self-test` and `description-needs-no-repository` cover the surface a consumer
# actually reads. A published Parquet carries its own descriptor in its footer, so
# someone holding an object URL can ask the file what it is instead of finding a second
# file in a repository they have no reason to know about. The first proves the stamp
# lands, survives, leaves every data byte where it was, and is refused when it does not.
# The second is the claim that cannot be checked by reading code: it blackholes
# `github.com` and `raw.githubusercontent.com` in `/etc/hosts`, watches the old path
# (fetching `datapackage.json` out of the repository) stop working, and asserts the
# object still answers. The script refuses to run — exit 2 — while a repository host is
# still reachable, so a demonstration that quietly ran unblocked cannot pass.
#
# `publish-seam` covers the other direction — that a publish declares what it
# uploaded, and that it uploads nothing a finished Run did not produce alongside the
# descriptor on disk — against a scratch HTTP object store and scratch B4 Run records,
# so it is offline and runs on every pull request. `endpoints-serve-what-is-declared`
# re-hashes every published object in full and so does NOT: it costs a download of
# every dataset, which is defensible once a merge lands and weekly thereafter, and not
# on each push to a branch.
name: descriptors

on:
  push:
    branches: [main]
  pull_request:
  # The descriptors are static; the files they describe are republished out of band,
  # so a passing merge does not stay true on its own.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: descriptors-${{ github.ref }}
  cancel-in-progress: true

env:
  # This is the READER's pin — the version every job below installs to run its own
  # checks. It is deliberately not reconciled here against the pin the publish
  # pipeline uses to WRITE these objects: that pipeline lives in a private repo this
  # public one cannot read, so a shared literal is not available without crossing a
  # boundary this repo does not cross. Instead of comparing two files in two repos,
  # `engine-version-matches-the-pin` compares this pin against what each published
  # object's own footer says wrote it — the difference, if any, is stated dynamically
  # at check time rather than declared statically here, and is a version skew between
  # writer and reader, not a claim about the two repos' literals agreeing.
  DUCKDB_VERSION: "1.5.5"
  PYTHON_VERSION: "3.12"

jobs:
  self-test:
    name: the check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: scratch fixtures, exit status and message
        run: python scripts/test_check_descriptors.py

  stamp-self-test:
    name: an object can carry its own description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: the stamp lands, the data does not move, the read asks for one URL
        run: python scripts/test_stamp_descriptor.py

  description-needs-no-repository:
    name: the description comes back with the repository blocked
    needs: stamp-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      # Fetched BEFORE the blackhole and cached, so the demonstration below needs no
      # host but the loopback object server. An extension downloaded mid-test would be
      # a read outside the object URL, which is the thing being disproved.
      - name: cache the httpfs extension while the network is whole
        run: python -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL httpfs'); c.execute('LOAD httpfs')"
      # After checkout, necessarily: the checkout itself comes from the host being
      # blocked. Everything the job still needs is already on disk.
      - name: put the repository out of reach
        run: |
          echo "0.0.0.0 github.com raw.githubusercontent.com" | sudo tee -a /etc/hosts
      - name: the old path dies and the object still answers
        run: python scripts/test_self_description_needs_no_repository.py

  descriptors-match-their-data:
    name: descriptors match their data
    needs: [self-test, stamp-self-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: every datapackage.json against its published Parquet
        shell: bash
        run: |
          set +e
          python scripts/check_descriptors.py --json descriptor-check.json > check.log 2>&1
          status=$?
          set -e
          cat check.log
          {
            echo '### Descriptor vs data'
            echo
            echo '```'
            cat check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: descriptor-check
          path: descriptor-check.json
          if-no-files-found: ignore

  engine-version-self-test:
    name: the engine-version check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: scratch footers, exit status and message
        run: python scripts/test_check_engine_version.py

  engine-version-matches-the-pin:
    name: every published footer names the engine this check is pinned to
    needs: engine-version-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: every datapackage.json resource's footer against this pin
        shell: bash
        run: |
          set +e
          python scripts/check_engine_version.py --json engine-version-check.json > engine.log 2>&1
          status=$?
          set -e
          cat engine.log
          {
            echo '### Writer engine vs reader pin'
            echo
            echo '```'
            cat engine.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-version-check
          path: engine-version-check.json
          if-no-files-found: ignore

  ingest-self-test:
    name: the ingest refuses an identifier that names nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: the shipped models, against scratch sources
        run: python datasets/edgar_gleif/scripts/test_ingest_lei.py

  join-self-test:
    name: the join runner can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: scratch packages, exit status and message
        run: python datasets/edgar_gleif/scripts/test_crosswalk_join.py

  joins-run-against-their-data:
    name: declared joins run against the published bytes
    needs: join-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"
      - name: every x-joins declaration against the objects it references
        shell: bash
        run: |
          set +e
          python datasets/edgar_gleif/scripts/crosswalk_join.py > joins.log 2>&1
          status=$?
          set -e
          cat joins.log
          {
            echo '### Declared joins vs data'
            echo
            echo '```'
            cat joins.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  publish-seam:
    name: a publish declares what it uploaded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: scratch object store, exit status and message
        run: python scripts/test_publish_dataset.py

  endpoints-serve-what-is-declared:
    name: endpoints serve the declared bytes and hash
    # Not on pull_request: this downloads every published object in full to re-hash
    # it. `bytes` is already covered per-PR by a one-byte range read in the job above;
    # `hash` cannot be, so it is checked here — on merge, weekly, and on demand.
    if: github.event_name != 'pull_request'
    needs: publish-seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: every declared bytes and hash against the object served
        run: python scripts/publish_dataset.py verify
