# Holds what the open lake stores to itself and to `main`. Pull requests never read the
# lake (descriptors.yml says what they check instead), and neither does a push to `main`:
# this workflow runs weekly and on demand, so a merge or a republish never turns `main`'s
# runs red. After a publish, start it with `gh workflow run lake.yml`.
#
# It emits every published table's descriptor from the lake into a tree laid out like
# `datasets/` (`scripts/emit_descriptor.py --all --tree`), then `scripts/lake_check.py`
# runs over that tree:
#
#   - the descriptor check (`check_descriptors.py --require-self-description`): each
#     `datasets/*/datapackage.json` against the bytes it describes and against the copy
#     stamped in the object's footer, with the licence rule and foreign keys; the licence
#     notice rule over every stored descriptor; and the README catalogue's row counts
#     against the objects its rows link to. The six per-table SOC descriptors
#     (`soc_2018/*.datapackage.json`, `soc_2020/*.datapackage.json`) are held to the same
#     rules, each read as a package of its own;
#   - the engine pin (`check_engine_version.py`): each footer's `created_by` against the
#     DuckDB the Run that published it pinned for its stamp steps, read from the lake's
#     run record;
#   - label agreement (`check_label_agreement.py --strict`), Frictionless
#     (`check_frictionless.py`) and the code-list contract (`check_code_list.py`; exit 2,
#     no code list found, is a crash and not a pass). Label agreement reads
#     `datasets/*/datapackage.json`; the other two read every descriptor, per-table ones
#     included;
#   - every declared join (`crosswalk_join.py`), per package that declares `x-joins`;
#   - the constraint ratchet: each stored descriptor still carries every constraint its
#     committed overrides hold at HEAD;
#   - a full download and re-hash of every served object, all 18 tables, against its
#     declared `bytes` and `hash` (`publish_dataset.py verify`'s measurement). This is
#     why the job takes minutes.
#
# Each finding is sorted into one of three kinds.
#
#   DRIFT: the lake contradicts itself (verify, a stored descriptor against its bytes or
#   its footer, the engine against the pin of the Run that published it, the code-list
#   contract, a declared join), whatever `main` did since, or a check that crashed. A
#   reader of the lake can see each, so the run fails, and the run opens an alert issue
#   labelled `lake-drift` (or comments on the open one). A green run closes it.
#
#   MAIN DISAGREES: a finding against a repository input (a catalogue row, a licence
#   notice, a label agreement reason, a Frictionless rejection, an overrides sidecar)
#   that has not changed since the table's `created`, such as a README row count a
#   republish moved past its rounding; or a finding about the repository alone. It is a
#   drift report: the run stays green, and the findings go to the weekly report issue
#   labelled `lake-report`, rewritten each run and closed by a run with nothing to
#   report, to be fixed on `main` in a batch. A README row count is rewritten with
#   `check_descriptors.py --write-catalogue`, which the report quotes.
#
#   AWAITING PUBLISH: the same comparison with the input changed in git after the
#   table's `created`, or a table not published yet: the expected gap between a merge
#   and its publish. Reported in the step summary and the weekly report; the run stays
#   green.
#
# `lake_check.py`'s docstring names each finding's input.
#
# `description-needs-no-repository` is not here: it serves a scratch object from
# loopback and reads no lake object, so it stays on pull requests (descriptors.yml).
#
# READING PAST THE EDGE. Every read goes to the origin, not a cached copy. The catalogue
# is attached as `ducklake:<url>?v=<run id>`: DuckLake accepts the query string (checked
# against DuckDB 2.0.0 on 2026-11-17), and the edge keys its cache on it, so each run
# misses. Its data files are new keys on each publish. Each readable copy is read as
# `<path>?v=<first 16 hex of its hash>` (`--bypass-edge`). arc writes the stable
# catalogue and the readable copies with `cache-control: public, max-age=60`, so without
# the query a read is at most a minute stale once an object has been published by arc.
#
# The versions below are descriptors.yml's: bump the two files together.
name: lake

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Read the repository; write issues only for the alert and the weekly report.
permissions:
  contents: read
  issues: write

concurrency:
  group: lake-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_VERSION: "2.0.0"
  PYTHON_VERSION: "3.12"
  PYYAML_VERSION: "6.0.3"
  FRICTIONLESS_VERSION: "5.19.0"

jobs:
  lake:
    name: the lake agrees with itself, and where main disagrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A finding is sorted by when its inputs last changed in git, so the checkout
          # needs full history; lake_check.py refuses a shallow one.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install duckdb, pyyaml and frictionless
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}" "pyyaml==${PYYAML_VERSION}" "frictionless==${FRICTIONLESS_VERSION}"
      - name: every published descriptor, emitted from the lake
        run: |
          python scripts/emit_descriptor.py --all --tree "$RUNNER_TEMP/tree" --bypass-edge \
            --catalog "ducklake:https://openlake.meridian.online/catalog/open.ducklake?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --manifest "https://openlake.meridian.online/manifest.json?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: the lake against itself and against main
        run: |
          python scripts/lake_check.py --tree "$RUNNER_TEMP/tree" --repo . --json lake-check.json \
            --alert lake-alert.md --report lake-report.md \
            --manifest "https://openlake.meridian.online/manifest.json?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-check
          path: lake-check.json
          if-no-files-found: ignore
      # A run that fails is the lake contradicting itself, or a check that could not run
      # at all: open the alert issue, or comment on the one already open.
      - name: open or update the alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const label = "lake-drift";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sorted = fs.existsSync("lake-check.json") && fs.existsSync("lake-alert.md") && JSON.parse(fs.readFileSync("lake-check.json", "utf8")).drift.length > 0;
            const found = sorted ? fs.readFileSync("lake-alert.md", "utf8") : "The lake check failed without sorting a finding as drift, so nothing says the lake is sound. The run's log says which step failed.\n";
            const body = `${found}\nRun: ${run}\nCommit: ${context.sha}\n`;
            const { owner, repo } = context.repo;
            // An issue created with a label that does not exist yet may lose it, and the
            // next run would then find no open issue to update: make the label first.
            const ensure = async (name, color) => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { if (e.status !== 404) throw e; await github.rest.issues.createLabel({ owner, repo, name, color }); }
            };
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await ensure(label, "b60205");
              await github.rest.issues.create({ owner, repo, title: "The open lake contradicts itself", body, labels: [label] });
            }
      - name: close the alert issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "lake-drift" });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `The lake check is green again: ${run}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
            }
      # The drift report: where main and the lake disagree, rewritten each run, whether or
      # not the run found drift. A run that never sorted its findings, or in which a check
      # crashed and so reported none of its own, leaves it alone: it would drop what the
      # crashed check would have reported, or close the issue on nothing.
      - name: update the weekly report issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("lake-check.json") || !fs.existsSync("lake-report.md")) return;
            const found = JSON.parse(fs.readFileSync("lake-check.json", "utf8"));
            if (found.drift.some((f) => f.crash)) return;
            const count = found.main_disagrees.length + found.awaiting_publish.length;
            const { owner, repo } = context.repo;
            const label = "lake-report";
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // An issue created with a label that does not exist yet may lose it, and the
            // next run would then find no open issue to update: make the label first.
            const ensure = async (name, color) => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { if (e.status !== 404) throw e; await github.rest.issues.createLabel({ owner, repo, name, color }); }
            };
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label });
            if (count === 0) {
              for (const issue of open.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Nothing to report: ${run}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              }
              return;
            }
            const title = `Lake report: main disagrees with the lake ${found.main_disagrees.length}, awaiting publish ${found.awaiting_publish.length}`;
            const body = `${fs.readFileSync("lake-report.md", "utf8")}\nRun: ${run}\nCommit: ${context.sha}\n`;
            if (open.data.length) {
              await github.rest.issues.update({ owner, repo, issue_number: open.data[0].number, title, body });
            } else {
              await ensure(label, "fbca04");
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
