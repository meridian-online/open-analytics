# The `census/naics_2022_titles` Protocol — the reproducible *definition* of how the U.S.
# Census Bureau's 2022 NAICS index file is ingested: one row per index entry, a business
# description and the six-digit NAICS code Census codes it to. `arc run` executes this
# manifest; one Run → one Dataset version. See ./README.md.
#
# CONFIG ONLY. Every step is a first-class `sql:` model or a typed `op:` operator (the
# arcform catalog). The fetches are http_fetch; the SQL reads Census's two workbooks, the
# index file and the NAICS descriptions the code list is built from; the COPY is
# parquet_export; datapackage_describe emits the descriptor; the shared title-index
# contract in ../../contracts/ holds the index to the code list; finetype_validate gates
# it; and stamp_descriptor writes the published Parquet with its descriptor in the
# footer. Operator code lives in the arcform repo, not here.
#
# THE CODE LIST. The contract holds every entry's code to the code list built in the
# same Run. census/naics_2022 is a Protocol of its own (../naics), so this one fetches
# the same Census descriptions workbook and builds the list with that Protocol's own
# model (`sql: ../naics/models/load.sql`), as Schedule B runs HTS's outline. The index
# then runs without the lake, and a change to how NAICS reads Census's file reaches both.
#
# TESTS. tests.yaml beside this file holds the Protocol's tests, which `arc test` runs
# against the cut-down Census workbooks in testdata/, with no network and no publish.
#
# ONE WRITER PER FILE. The export and describe work on build/stage/; stamp_descriptor
# alone writes the published build/naics_2022_titles.parquet and datapackage.json.
#
# THE RELEASE. Census's index file names no release: it has no title block, and the
# only date it carries is the save time Excel wrote into the workbook's properties
# (2022-02-04), which is not Census's statement of a revision. NAICS 2022 is a fixed
# edition, so `release` is the edition, 2022, as titles.sql writes it.
#
# PUBLISH. The last step, `publish` (ducklake_write), writes the table into the shared
# open lake as one snapshot: the catalog, the data file and the table's readable Parquet
# copy on R2 (public at https://openlake.meridian.online/). With all three R2 variables
# set, from .env or the environment, EVERY `arc run` publishes into the live lake;
# `arc run --publish` only makes a missing credential fail the run instead of publishing
# into build/lake/. For local work keep .env absent and the variables unset. Keep the
# credential outside this folder and export it for the publishing command only. Readers
# need DuckDB 2.0 or later. It reads only what stamp_descriptor wrote, so it runs after it.
#
# Produces: build/naics_2022_titles.parquet  →  published as census/naics_2022_titles
name: naics_2022_titles
engine: duckdb
# Kept in step with ../soc_2018, which pins the DuckDB that arc links (2.0), the writer of its published Parquet.
engine_version: ">=2.0"
db: build/naics_2022_titles.db
# The R2 write credential, if a .env is present (see .env.example); the process environment also counts.
dotenv: [.env]

defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: Census's 2022 NAICS index file, and the descriptions the code list is from ─
  - name: fetch_index
    op: http_fetch@1
    with:
      url: https://www.census.gov/naics/2022NAICS/2022_NAICS_Index_File.xlsx
      out: build/census/2022_NAICS_Index_File.xlsx
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # The path is the one ../naics/models/load.sql reads, relative to the Protocol folder.
  - name: fetch_naics
    op: http_fetch@1
    with:
      url: https://www.census.gov/naics/2022NAICS/2022_NAICS_Descriptions.xlsx
      out: build/naics_desc.xlsx
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # ── Code list: census/naics_2022's own model, over the same Census workbook ─────
  - name: load_naics
    sql: ../naics/models/load.sql
    depends_on: [build/naics_desc.xlsx]
    produces: [naics]

  # ── Load: stage the index entries ───────────────────────────────────────────────
  # Fails the run on a header row that has moved, an entry without a six-digit code or
  # a description, or a ****** row that is not a cross-reference. See the model's header.
  - name: load
    sql: models/load.sql
    depends_on: [build/census/2022_NAICS_Index_File.xlsx]
    produces: [naics_index]

  # ── Build: the index, with each code's title from the code list ─────────────────
  - name: titles
    sql: models/titles.sql
    depends_on: [naics_index, naics]
    produces: [naics_2022_titles_out]

  # ── Export: write the Parquet the later steps read ──────────────────────────────
  # order_by entry_id (the primary key) is a total order → reproducible bytes.
  - name: export_naics_2022_titles
    op: parquet_export@1
    with:
      input: naics_2022_titles_out
      dest: build/stage/naics_2022_titles.parquet
      compression: zstd
      order_by: "entry_id"

  # ── Describe: EMIT the descriptor from the built Parquet ────────────────────────
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/stage/naics_2022_titles.parquet
      overrides: descriptor.overrides.json
      nominations: nominations.finetype.json
      out: build/stage/described.json

  # ── Contract: hold the index to the job-title index contract ────────────────────
  # check_inputs points the shared check at the exported index and the code list built
  # in this Run, at the national-industry level Census codes its entries to; the check
  # fails the run on any broken rule (see contracts/README.md).
  - name: check_inputs
    sql: models/check_inputs.sql
    depends_on: [build/stage/naics_2022_titles.parquet, naics]
    produces: [contract_code_list, contract_titles, contract_title_level]

  - name: check_titles
    sql: ../../contracts/check_titles.sql
    depends_on: [contract_titles, contract_title_level, contract_code_list]
    produces: [contract_titles_result]

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ─
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/stage/naics_2022_titles.parquet
      schema: schema.finetype.json

  # ── Self-describe: write the published Parquet with its descriptor inside ───────
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      sha256: a9356ac8d5412d94a940ebeef1e2508eaed6b77f1d923ada88edbacccf9d9b81
      deps:
        - duckdb==2.0.0
      args:
        - stamp
        - --descriptor
        - build/stage/described.json
        - --parquet
        - build/stage/naics_2022_titles.parquet
        - --out
        - build/naics_2022_titles.parquet
        - --out-descriptor
        - datapackage.json
        - --carry-created
      reads:
        - build/stage/described.json
        - build/stage/naics_2022_titles.parquet
      produces:
        - build/naics_2022_titles.parquet
        - datapackage.json

  # ── Publish: the table into the open lake, one snapshot ─────────────────────────
  # Runs on every `arc run`. With R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID
  # all set, every run publishes live; otherwise into build/lake/, and `arc run --publish`
  # fails instead.
  - name: publish
    op: ducklake_write@1
    with:
      public_base: https://openlake.meridian.online/
      catalog: catalog/open.ducklake
      data_path: lake/
      runs: runs/
      manifest: manifest.json
      local_catalog: build/lake/open.ducklake
      tables:
        - table: census.naics_2022_titles
          from: build/naics_2022_titles.parquet
          descriptor: datapackage.json
          readable_copy: census/naics_2022_titles.parquet
      credential:
        type: r2
        bucket: meridian-open
        env:
          key_id: R2_ACCESS_KEY_ID
          secret: R2_SECRET_ACCESS_KEY
          account_id: R2_ACCOUNT_ID
