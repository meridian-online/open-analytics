# The `census.naics_2022` Protocol — the reproducible *definition* of how the NAICS 2022
# industry-classification Dataset is ingested from the official U.S. Census file.
# `arc run` executes this manifest; one Run → one Dataset version. See ./README.md.
#
# ALL-CONFIG. Every step is a first-class `sql:` model or a typed `op:` operator (the
# arcform catalog); `stamp_descriptor` runs its script through `op: uv@1`. The curl fetch
# is http_fetch; the terminal COPY is parquet_export; datapackage_describe emits the
# descriptor from the built Parquet; finetype_validate gates it. (The Census workbook is
# an .xlsx — load.sql reads it directly via DuckDB's `excel` extension, so no external
# xlsx→csv tool is needed.) Operator code lives in the arcform repo, not here.
#
# PUBLISH. The last step, `publish` (ducklake_write), writes the table into the shared
# open lake as one snapshot: the catalog, the data file and the table's readable Parquet
# copy on R2 (public at https://openlake.meridian.online/). With all three R2 variables
# set, from .env or the environment, EVERY `arc run` publishes into the live lake;
# `arc run --publish` only makes a missing credential fail the run instead of publishing
# into build/lake/. For local work keep .env absent and the variables unset. Keep the
# credential outside this folder and export it for the publishing command only. Readers
# need DuckDB 2.0 or later. It reads only what stamp_descriptor wrote, so it runs after it.
#
# Produces: build/naics.parquet  →  published as census.naics_2022
name: naics
engine: duckdb
# Kept in step with ../soc_2018, which pins the DuckDB that arc links (2.0), the writer of its published Parquet.
engine_version: ">=2.0"
db: build/naics.db
# The R2 write credential, if a .env is present (see .env.example); the process environment also counts.
dotenv: [.env]

# Transient API/network blips shouldn't sink a run — retry fetches with backoff.
defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: the Census 2022 NAICS descriptions workbook ───────────────────────────
  # http_fetch carries the content-freshness contract (conditional re-fetch). The 2022
  # vintage is effectively frozen.
  - name: fetch_naics
    op: http_fetch@1
    with:
      url: https://www.census.gov/naics/2022NAICS/2022_NAICS_Descriptions.xlsx
      out: build/naics_desc.xlsx
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # ── Load + normalise: strip the trilateral 'T' marker, derive level, null blanks ─
  # Reads the .xlsx directly (DuckDB `excel` extension, `read_xlsx`).
  - name: load
    sql: models/load.sql
    depends_on: [build/naics_desc.xlsx]

  # ── Package: materialise the terminal table (adds the search corpus) ─────────────
  - name: package
    sql: models/package.sql
    produces: [naics_out]

  # ── Export: write the terminal Parquet the publish seam consumes ─────────────────
  # parquet_export replaces package.sql's old `COPY … (COMPRESSION zstd)` — a first-class
  # produced asset the engine orders + stale-propagates. order_by code (the primary key)
  # is a total order → reproducible bytes.
  - name: export_naics
    op: parquet_export@1
    with:
      input: naics_out
      dest: build/naics.parquet
      compression: zstd
      order_by: "code"

  # ── Describe: EMIT build/datapackage.json from the built Parquet ─────────────────
  # finetype types every column nominations.finetype.json does not declare;
  # descriptor.overrides.json overlays the curated half
  # (identity, licenses, sources, per-field prose, primaryKey). Hard-fails on drift.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/naics.parquet
      overrides: descriptor.overrides.json
      # The columns whose type is declared rather than inferred. finetype takes each one
      # as given, carries its label's bounds, marks it x-finetype-nominated and states no
      # confidence for it; the file says why each was declared.
      nominations: nominations.finetype.json
      out: build/datapackage.json

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ──
  # finetype_validate (CHECK-ONLY) checks the terminal Parquet against schema.finetype.json
  # (self-derived from THIS Parquet — see its $comment). Pass-through today, fail-closed
  # drift tripwire for future Runs; writes nothing, so build/naics.parquet is untouched.
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/naics.parquet
      schema: schema.finetype.json
  # ── Lake: every published table's descriptor, as the open lake holds it ─────────
  # The repository commits no descriptor: the lake's meta.descriptors and manifest.json
  # hold the one stored copy, and emit_descriptor.py joins the two back into each
  # table's full descriptor and writes them all to one bundle, table name to descriptor.
  # It runs before the stamp, which keeps the lake's `created` when it writes the object
  # the lake already serves; the check before publish compares this build against it. It
  # reads the public catalogue and manifest, with no credential, and declares both as
  # remote reads, so arc runs it on every run. One file, so `arc test` can fixture this
  # step by name.
  # `shasum -a 256 scripts/emit_descriptor.py` prints the digest.
  - name: emit_descriptors
    op: uv@1
    with:
      script: ../../scripts/emit_descriptor.py
      sha256: 897e2c94fc2c51187f852f595d8bd61a04308ecac6a35a2f28e57c1183e2aaec
      deps:
        - duckdb==2.0.0
        - pyyaml==6.0.3
      args:
        - --all
        - --bundle
        - build/lake_descriptors.json
      # The tables it emits are the ones every Protocol's publish step names.
      reads:
        - https://openlake.meridian.online/catalog/open.ducklake
        - https://openlake.meridian.online/manifest.json
        - ../../datasets/*/arcform.yaml
      produces:
        - build/lake_descriptors.json

  # ── Self-describe: put the descriptor INSIDE the Parquet it describes ───────────
  # Someone holding https://openlake.meridian.online/census/naics_2022.parquet
  # cannot find the datapackage.json that describes it: it is a second record, in a
  # catalogue they have no reason to know exists. This step writes the finished
  # descriptor into the file's own Parquet footer, so the object answers for itself
  # from its URL alone:
  #   SELECT decode(value) FROM parquet_kv_metadata('<url>')
  #    WHERE decode(key) = 'datapackage.json';
  #
  # It is the last step that shapes the descriptor, because it embeds the FINISHED
  # descriptor; only the checks before publish follow it. It re-measures the
  # resource `bytes` and `hash` because stamping lengthens the file past the figures
  # describe took off the unstamped build.
  #
  # It is NOT a field on parquet_export above. That operator's `metadata:` values are
  # literal strings in this manifest, and the descriptor does not exist until describe
  # has read the very Parquet that would have to carry it.
  #
  # The embedded copy omits the resource `bytes` and `hash`, and the package's
  # `created`: a file cannot state its own size, because writing the value changes it,
  # and a write time moves on a publish that changed nothing else. Those stay in
  # build/datapackage.json, which publish stores in the lake, measured against the
  # finished object; check_descriptors.py holds the two copies to each other.
  #
  # Everything before the footer is compared byte for byte, so the order_by above still
  # decides the data bytes and a stamp that moved one is refused with the original left
  # in place. Re-running the step is a no-op to the byte.
  #
  # `--carry-created-from` keeps the `created` the lake's copy states when the stamped
  # file is the object the lake already serves; anything else, a first publish included,
  # takes the one `describe` wrote.
  #
  # `op: uv@1` rather than a bare `python3`: the readback imports duckdb, and a
  # `python3` without it failed the step. uv resolves the interpreter and the package
  # itself. It rewrites, in place, the Parquet `export_naics` wrote and the
  # build/datapackage.json `describe` wrote, so each of those files has two writers; giving
  # each one writer, as edgar_gleif and the code lists do, is a separate restructure.
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      # `shasum -a 256 scripts/stamp_descriptor.py` prints this.
      sha256: c36284fd200d76a6e5f3da9e3051a9dd8fe057df99603ed80e79043ef6dbb5a1
      # Pinned to the DuckDB that engine_version names. The stamp
      # rewrites no data page, so this need not be the DuckDB that wrote the Parquet.
      deps:
        - duckdb==2.0.0
      args:
        - stamp
        - --carry-created-from
        - build/lake_descriptors.json
        - --table
        - census.naics_2022
        - --descriptor
        - build/datapackage.json
        - --parquet
        - build/naics.parquet
      reads:
        - build/lake_descriptors.json
        - build/datapackage.json
        - build/naics.parquet
      produces:
        - build/datapackage.json
        - build/naics.parquet

  # ── Check: the built table against the lake, before it is published ─────────────
  # check_before_publish.py runs four checks on this build. Three read the lake too:
  # label agreement (strict, on what involves this table) against every other table's
  # descriptor in the bundle, the frictionless reference implementation over the built
  # descriptor, and check_descriptors.py's rules read against the local Parquet. The
  # fourth holds the build to the committed overrides. A failing check fails
  # the run, so publish never runs. Each built descriptor keeps the path it is published
  # at; the script reads the bytes from the local Parquet instead. It imports its
  # sibling checks in-process and the digest pins only its own bytes, so those scripts
  # are reads too: editing one makes this step stale.
  # `shasum -a 256 scripts/check_before_publish.py` prints the digest.
  - name: check_before_publish
    op: uv@1
    with:
      script: ../../scripts/check_before_publish.py
      sha256: 53bd12b2ba03901deea8a9d559764639557ca5b7539567d10abda6b0a62e99a5
      deps:
        - duckdb==2.0.0
        - pyyaml==6.0.3
        - frictionless==5.19.0
      args:
        - --datasets-dir
        - ../../datasets
        - --slug
        - naics
        - --lake-bundle
        - build/lake_descriptors.json
        - --built
        - build/datapackage.json=build/naics.parquet
        - --json
        - build/check_before_publish.json
      reads:
        - build/lake_descriptors.json
        - build/datapackage.json
        - build/naics.parquet
        - ../../datasets/*/arcform.yaml
        - ../../datasets/label-agreement.json
        - ../../datasets/frictionless-rejections.json
        - ../../datasets/licence-notices.json
        - ../../scripts/check_descriptors.py
        - ../../scripts/check_constraint_ratchet.py
        - ../../scripts/check_frictionless.py
        - ../../scripts/check_label_agreement.py
        - ../../scripts/emit_descriptor.py
        - ../../scripts/stamp_descriptor.py
      produces:
        - build/check_before_publish.json

  # ── Publish: the table into the open lake, one snapshot ─────────────────────────
  # Runs on every `arc run`. With R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID
  # all set, every run publishes live; otherwise into build/lake/, and `arc run --publish`
  # fails instead.
  - name: publish
    op: ducklake_write@1
    with:
      public_base: https://openlake.meridian.online/
      catalog: catalog/open.ducklake
      data_path: lake/
      runs: runs/
      manifest: manifest.json
      local_catalog: build/lake/open.ducklake
      tables:
        - table: census.naics_2022
          from: build/naics.parquet
          descriptor: build/datapackage.json
          readable_copy: census/naics_2022.parquet
      credential:
        type: r2
        bucket: meridian-open
        env:
          key_id: R2_ACCESS_KEY_ID
          secret: R2_SECRET_ACCESS_KEY
          account_id: R2_ACCOUNT_ID
