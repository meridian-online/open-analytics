# The `census.naics_2022` Protocol — the reproducible *definition* of how the NAICS 2022
# industry-classification Dataset is ingested from the official U.S. Census file.
# `arc run` executes this manifest; one Run → one Dataset version. See ./README.md.
#
# ALL-CONFIG. Every step is a first-class `sql:` model or a typed `op:` operator (the
# arcform catalog); `stamp_descriptor` runs its script through `op: uv@1`. The curl fetch
# is http_fetch; the terminal COPY is parquet_export; datapackage_describe emits the
# descriptor from the built Parquet; finetype_validate gates it. (The Census workbook is
# an .xlsx — load.sql reads it directly via DuckDB's `excel` extension, so no external
# xlsx→csv tool is needed.) Operator code lives in the arcform repo, not here.
#
# BOUNDARY — do NOT fold this into this manifest:
#   • PUBLISH (content-addressed R2 upload + manifest/catalog pointer flip) stays in
#     the out-of-repo publish pipeline and READS this Protocol's terminal output,
#     build/naics.parquet + the emitted datapackage.json. It is not an arcform step.
#
# Produces: build/naics.parquet  →  published as census.naics_2022
name: naics
engine: duckdb
engine_version: ">=1.2"
db: build/naics.db

# Transient API/network blips shouldn't sink a run — retry fetches with backoff.
defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: the Census 2022 NAICS descriptions workbook ───────────────────────────
  # http_fetch carries the content-freshness contract (conditional re-fetch). The 2022
  # vintage is effectively frozen.
  - name: fetch_naics
    op: http_fetch@1
    with:
      url: https://www.census.gov/naics/2022NAICS/2022_NAICS_Descriptions.xlsx
      out: build/naics_desc.xlsx
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # ── Load + normalise: strip the trilateral 'T' marker, derive level, null blanks ─
  # Reads the .xlsx directly (DuckDB `excel` extension, `read_xlsx`).
  - name: load
    sql: models/load.sql
    depends_on: [build/naics_desc.xlsx]

  # ── Package: materialise the terminal table (adds the search corpus) ─────────────
  - name: package
    sql: models/package.sql
    produces: [naics_out]

  # ── Export: write the terminal Parquet the publish seam consumes ─────────────────
  # parquet_export replaces package.sql's old `COPY … (COMPRESSION zstd)` — a first-class
  # produced asset the engine orders + stale-propagates. order_by code (the primary key)
  # is a total order → reproducible bytes.
  - name: export_naics
    op: parquet_export@1
    with:
      input: naics_out
      dest: build/naics.parquet
      compression: zstd
      order_by: "code"

  # ── Describe: EMIT datapackage.json from the built Parquet ───────────────────────
  # finetype types every column nominations.finetype.json does not declare;
  # descriptor.overrides.json overlays the curated half
  # (identity, licenses, sources, per-field prose, primaryKey). Hard-fails on drift.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/naics.parquet
      overrides: descriptor.overrides.json
      # The columns whose type is declared rather than inferred. finetype takes each one
      # as given, carries its label's bounds, marks it x-finetype-nominated and states no
      # confidence for it; the file says why each was declared.
      nominations: nominations.finetype.json
      out: datapackage.json

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ──
  # finetype_validate (CHECK-ONLY) checks the terminal Parquet against schema.finetype.json
  # (self-derived from THIS Parquet — see its $comment). Pass-through today, fail-closed
  # drift tripwire for future Runs; writes nothing, so build/naics.parquet is untouched.
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/naics.parquet
      schema: schema.finetype.json
  # ── Self-describe: put the descriptor INSIDE the Parquet it describes ───────────
  # Someone holding https://openlake.meridian.online/census/naics_2022.parquet
  # cannot find the datapackage.json that describes it: it is a second file, in a
  # source repository they have no reason to know exists, and behind an authenticating
  # edge there is no repository to find. This step writes the finished descriptor into
  # the file's own Parquet footer, so the object answers for itself from its URL alone:
  #   SELECT decode(value) FROM parquet_kv_metadata('<url>')
  #    WHERE decode(key) = 'datapackage.json';
  #
  # It runs LAST because it embeds the FINISHED descriptor, and it re-measures the
  # resource `bytes` and `hash` because stamping lengthens the file past the figures
  # describe took off the unstamped build.
  #
  # It is NOT a field on parquet_export above. That operator's `metadata:` values are
  # literal strings in this manifest, and the descriptor does not exist until describe
  # has read the very Parquet that would have to carry it.
  #
  # The embedded copy omits the resource `bytes` and `hash`, and the package's
  # `created`: a file cannot state its own size, because writing the value changes it,
  # and a write time moves on a publish that changed nothing else. Those stay in
  # datapackage.json, measured against the finished object; check_descriptors.py holds
  # the two copies to each other.
  #
  # Everything before the footer is compared byte for byte, so the order_by above still
  # decides the data bytes and a stamp that moved one is refused with the original left
  # in place. Re-running the step is a no-op to the byte.
  #
  # `op: uv@1` rather than a bare `python3`: the readback imports duckdb, and a
  # `python3` without it failed the step. uv resolves the interpreter and the package
  # itself. It rewrites, in place, the Parquet `export_naics` wrote and the
  # datapackage.json `describe` wrote, so each of those files has two writers; giving
  # each one writer, as edgar_gleif and the code lists do, is a separate restructure.
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      # `shasum -a 256 scripts/stamp_descriptor.py` prints this.
      sha256: a9356ac8d5412d94a940ebeef1e2508eaed6b77f1d923ada88edbacccf9d9b81
      # Pinned to DUCKDB_VERSION in .github/workflows/descriptors.yml. The stamp
      # rewrites no data page, so this need not be the DuckDB that wrote the Parquet.
      deps:
        - duckdb==1.5.5
      args:
        - stamp
        - --descriptor
        - datapackage.json
        - --parquet
        - build/naics.parquet
      reads:
        - datapackage.json
        - build/naics.parquet
      produces:
        - datapackage.json
        - build/naics.parquet

  # publish: the out-of-repo publish pipeline reads build/naics.parquet + the emitted
  # datapackage.json (boundary — not an arc step). See README.
