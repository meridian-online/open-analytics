# The `usitc/hts` Protocol — the reproducible *definition* of how the Harmonized Tariff
# Schedule of the United States is ingested from the U.S. International Trade
# Commission's published JSON export. `arc run` executes this manifest; one Run → one
# Dataset version. See ./README.md.
#
# ALL-CONFIG. Every step is a first-class `sql:` model or a typed `op:` operator (the
# arcform catalog); `stamp_descriptor` runs its script through `op: uv@1`. The three
# fetches are http_fetch; the SQL builds the outline, the ladder and the terminal table;
# the COPY is parquet_export; datapackage_describe emits the descriptor from the built
# Parquet; check_code_list holds the Parquet to the shared code-list contract;
# finetype_validate gates it. Operator code lives in the arcform repo, not here.
#
# PUBLISH. The last step, `publish` (ducklake_write), writes the table into the shared
# open lake as one snapshot: the catalog, the data file and the table's readable Parquet
# copy on R2 (public at https://openlake.meridian.online/). With all three R2 variables
# set, from .env or the environment, EVERY `arc run` publishes into the live lake;
# `arc run --publish` only makes a missing credential fail the run instead of publishing
# into build/lake/. For local work keep .env absent and the variables unset. Keep the
# credential outside this folder and export it for the publishing command only. Readers
# need DuckDB 2.0 or later. It reads only what stamp_descriptor wrote, so it runs after it.
#
# Produces: build/hts.parquet  →  published as usitc/hts
name: hts
engine: duckdb
# Kept in step with ../soc_2018, which pins the DuckDB that arc links (2.0), the writer of its published Parquet.
engine_version: ">=2.0"
db: build/hts.db
# The R2 write credential, if a .env is present (see .env.example); the process environment also counts.
dotenv: [.env]

# Transient API/network blips shouldn't sink a run — retry fetches with backoff.
defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: USITC's current revision, its schedule, and the revision again ─────────
  # USITC's export serves only the current revision. Naming the revision before and
  # after the 12.6 MB download brackets it: load.sql fails the run if the two differ,
  # so a schedule that changed mid-fetch is never published under one revision's name.
  - name: fetch_release_before
    op: http_fetch@1
    with:
      url: https://hts.usitc.gov/reststop/currentRelease
      out: build/release_before.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  - name: fetch_hts
    op: http_fetch@1
    with:
      url: "https://hts.usitc.gov/reststop/exportList?from=0100&to=9999&format=JSON&styles=false"
      out: build/hts.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  - name: fetch_release_after
    op: http_fetch@1
    depends_on: [build/hts.json]
    with:
      url: https://hts.usitc.gov/reststop/currentRelease
      out: build/release_after.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # ── Outline: USITC's rows in order, with their indent chains and every code prefix ─
  # The file is shared: the Schedule B Protocol runs it by relative path.
  - name: outline
    sql: models/outline.sql
    depends_on: [build/hts.json]

  # ── Load: the ladder, parents, text, rates and release ───────────────────────────
  # Fails the run if the two release files name different revisions, or if a chapter
  # has no title in chapters.csv.
  - name: load
    sql: models/load.sql
    depends_on: [build/release_before.json, build/release_after.json, chapters.csv]

  # ── Package: materialise the terminal table (adds the search corpus) ─────────────
  - name: package
    sql: models/package.sql
    produces: [hts_out]

  # ── Export: write the terminal Parquet the publish seam consumes ─────────────────
  # order_by code (the primary key) is a total order → reproducible bytes.
  - name: export_hts
    op: parquet_export@1
    with:
      input: hts_out
      dest: build/hts.parquet
      compression: zstd
      order_by: "code"

  # ── Describe: EMIT build/datapackage.json from the built Parquet ─────────────────
  # finetype types every column nominations.finetype.json does not declare;
  # descriptor.overrides.json overlays the curated half (identity, licenses, sources,
  # per-field prose, primaryKey, the code-list declaration). Hard-fails on drift.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/hts.parquet
      overrides: descriptor.overrides.json
      nominations: nominations.finetype.json
      out: build/datapackage.json

  # ── Contract: hold the Parquet to the shared code-list columns ───────────────────
  # scripts/check_code_list.py reads the built file and refuses one that breaks the
  # contract (a parent that is missing or not one level up, a depth that is not the
  # level's position, a repeated or empty code). The script is addressed by its
  # bytes, so editing it is a manifest edit as well:
  # `shasum -a 256 scripts/check_code_list.py` prints the digest. duckdb is pinned to
  # the same version as the stamp step below, which engine_version above names.
  - name: check_code_list
    op: uv@1
    with:
      script: ../../scripts/check_code_list.py
      sha256: a6d4fd3c42aca53591f7f94bfef625f9c4f503b2d4331b64bea8103db88f7102
      deps:
        - duckdb==2.0.0
      args:
        - --parquet
        - build/hts.parquet
        - --levels
        - chapter,heading,subheading,tariff_line,statistical_line
        - --json
        - build/code_list_check.json
      reads:
        - build/hts.parquet
      # uv@1 must name what it writes. The check writes nothing else, and fails the run
      # (exit 1) on a broken contract; its findings go to this file.
      produces:
        - build/code_list_check.json

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ──
  # finetype_validate (CHECK-ONLY) checks the terminal Parquet against
  # schema.finetype.json; writes nothing, so build/hts.parquet is untouched.
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/hts.parquet
      schema: schema.finetype.json

  # ── Lake: every published table's descriptor, as the open lake holds it ─────────
  # The repository commits no descriptor: the lake's meta.descriptors and manifest.json
  # hold the one stored copy, and emit_descriptor.py joins the two back into each
  # table's full descriptor and writes them all to one bundle, table name to descriptor.
  # It runs before the stamp, which keeps the lake's `created` when it writes the object
  # the lake already serves; the check before publish compares this build against it. It
  # reads the public catalogue and manifest, with no credential, and declares both as
  # remote reads, so arc runs it on every run. One file, so `arc test` can fixture this
  # step by name.
  # `shasum -a 256 scripts/emit_descriptor.py` prints the digest.
  - name: emit_descriptors
    op: uv@1
    with:
      script: ../../scripts/emit_descriptor.py
      sha256: 300a284f5a2fdc7be0ae0d1bffb5d8962860bba10382f45c84634fe073181a2e
      deps:
        - duckdb==2.0.0
        - pyyaml==6.0.3
      args:
        - --all
        - --bundle
        - build/lake_descriptors.json
      # The tables it emits are the ones every Protocol's publish step names.
      reads:
        - https://openlake.meridian.online/catalog/open.ducklake
        - https://openlake.meridian.online/manifest.json
        - ../../datasets/*/arcform.yaml
      produces:
        - build/lake_descriptors.json

  # ── Self-describe: put the descriptor INSIDE the Parquet it describes ───────────
  # As NAICS's does: the object answers for itself from its URL alone, the embedded
  # copy omits the resource `bytes` and `hash` and the package's `created`, and the
  # step is the last that shapes the descriptor, because it embeds the FINISHED one;
  # only the checks before publish follow it.
  # `--carry-created-from` keeps the `created` the lake's copy states when the stamped
  # file is the object the lake already serves; anything else, a first publish included,
  # takes the one `describe` wrote.
  #
  # `op: uv@1` rather than a bare `python3`: the readback imports duckdb, and a
  # `python3` without it failed the step. uv resolves the interpreter and the package
  # itself. It rewrites, in place, the Parquet `export_hts` wrote and the
  # build/datapackage.json `describe` wrote, so each of those files has two writers; giving
  # each one writer, as edgar_gleif and the code lists do, is a separate restructure.
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      # `shasum -a 256 scripts/stamp_descriptor.py` prints this.
      sha256: c36284fd200d76a6e5f3da9e3051a9dd8fe057df99603ed80e79043ef6dbb5a1
      # Pinned to the DuckDB that engine_version names. The stamp
      # rewrites no data page, so this need not be the DuckDB that wrote the Parquet.
      deps:
        - duckdb==2.0.0
      args:
        - stamp
        - --carry-created-from
        - build/lake_descriptors.json
        - --table
        - usitc.hts
        - --descriptor
        - build/datapackage.json
        - --parquet
        - build/hts.parquet
      reads:
        - build/lake_descriptors.json
        - build/datapackage.json
        - build/hts.parquet
      produces:
        - build/datapackage.json
        - build/hts.parquet

  # ── Check: the built table against the lake, before it is published ─────────────
  # check_before_publish.py runs the three checks that need both this build and what the
  # lake holds: label agreement (strict) against every other table's descriptor in the
  # bundle, the frictionless reference implementation over the built descriptor, and
  # check_descriptors.py's rules read against the local Parquet. A failing check fails
  # the run, so publish never runs. Each built descriptor keeps the path it is published
  # at; the script reads the bytes from the local Parquet instead. It imports its
  # sibling checks in-process and the digest pins only its own bytes, so those scripts
  # are reads too: editing one makes this step stale.
  # `shasum -a 256 scripts/check_before_publish.py` prints the digest.
  - name: check_before_publish
    op: uv@1
    with:
      script: ../../scripts/check_before_publish.py
      sha256: a5ed1f3bc4ba55e6345be646491f8b417b4946ff690eb10135d32653cde9b7b5
      deps:
        - duckdb==2.0.0
        - pyyaml==6.0.3
        - frictionless==5.19.0
      args:
        - --datasets-dir
        - ../../datasets
        - --slug
        - hts
        - --lake-bundle
        - build/lake_descriptors.json
        - --built
        - build/datapackage.json=build/hts.parquet
        - --json
        - build/check_before_publish.json
      reads:
        - build/lake_descriptors.json
        - build/datapackage.json
        - build/hts.parquet
        - ../../datasets/*/arcform.yaml
        - ../../datasets/label-agreement.json
        - ../../datasets/frictionless-rejections.json
        - ../../datasets/licence-notices.json
        - ../../scripts/check_descriptors.py
        - ../../scripts/check_frictionless.py
        - ../../scripts/check_label_agreement.py
        - ../../scripts/emit_descriptor.py
        - ../../scripts/stamp_descriptor.py
      produces:
        - build/check_before_publish.json

  # ── Publish: the table into the open lake, one snapshot ─────────────────────────
  # Runs on every `arc run`. With R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID
  # all set, every run publishes live; otherwise into build/lake/, and `arc run --publish`
  # fails instead.
  - name: publish
    op: ducklake_write@1
    with:
      public_base: https://openlake.meridian.online/
      catalog: catalog/open.ducklake
      data_path: lake/
      runs: runs/
      manifest: manifest.json
      local_catalog: build/lake/open.ducklake
      tables:
        - table: usitc.hts
          from: build/hts.parquet
          descriptor: build/datapackage.json
          readable_copy: usitc/hts.parquet
      credential:
        type: r2
        bucket: meridian-open
        env:
          key_id: R2_ACCESS_KEY_ID
          secret: R2_SECRET_ACCESS_KEY
          account_id: R2_ACCOUNT_ID
