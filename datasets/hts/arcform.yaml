# The `usitc/hts` Protocol — the reproducible *definition* of how the Harmonized Tariff
# Schedule of the United States is ingested from the U.S. International Trade
# Commission's published JSON export. `arc run` executes this manifest; one Run → one
# Dataset version. See ./README.md.
#
# ALL-CONFIG. Every step is a first-class `sql:` model or a typed `op:` operator (the
# arcform catalog); `stamp_descriptor` runs its script through `op: uv@1`. The three
# fetches are http_fetch; the SQL builds the outline, the ladder and the terminal table;
# the COPY is parquet_export; datapackage_describe emits the descriptor from the built
# Parquet; check_code_list holds the Parquet to the shared code-list contract;
# finetype_validate gates it. Operator code lives in the arcform repo, not here.
#
# BOUNDARY — do NOT fold this into this manifest:
#   • PUBLISH (content-addressed R2 upload + manifest/catalog pointer flip) stays in
#     the out-of-repo publish pipeline and READS this Protocol's terminal output,
#     build/hts.parquet + the emitted datapackage.json. It is not an arcform step.
#
# Produces: build/hts.parquet  →  published as usitc/hts
name: hts
engine: duckdb
engine_version: ">=1.2"
db: build/hts.db

# Transient API/network blips shouldn't sink a run — retry fetches with backoff.
defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: USITC's current revision, its schedule, and the revision again ─────────
  # USITC's export serves only the current revision. Naming the revision before and
  # after the 12.6 MB download brackets it: load.sql fails the run if the two differ,
  # so a schedule that changed mid-fetch is never published under one revision's name.
  - name: fetch_release_before
    op: http_fetch@1
    with:
      url: https://hts.usitc.gov/reststop/currentRelease
      out: build/release_before.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  - name: fetch_hts
    op: http_fetch@1
    with:
      url: "https://hts.usitc.gov/reststop/exportList?from=0100&to=9999&format=JSON&styles=false"
      out: build/hts.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  - name: fetch_release_after
    op: http_fetch@1
    depends_on: [build/hts.json]
    with:
      url: https://hts.usitc.gov/reststop/currentRelease
      out: build/release_after.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # ── Outline: USITC's rows in order, with their indent chains and every code prefix ─
  # The file is shared: the Schedule B Protocol runs it by relative path.
  - name: outline
    sql: models/outline.sql
    depends_on: [build/hts.json]

  # ── Load: the ladder, parents, text, rates and release ───────────────────────────
  # Fails the run if the two release files name different revisions, or if a chapter
  # has no title in chapters.csv.
  - name: load
    sql: models/load.sql
    depends_on: [build/release_before.json, build/release_after.json, chapters.csv]

  # ── Package: materialise the terminal table (adds the search corpus) ─────────────
  - name: package
    sql: models/package.sql
    produces: [hts_out]

  # ── Export: write the terminal Parquet the publish seam consumes ─────────────────
  # order_by code (the primary key) is a total order → reproducible bytes.
  - name: export_hts
    op: parquet_export@1
    with:
      input: hts_out
      dest: build/hts.parquet
      compression: zstd
      order_by: "code"

  # ── Describe: EMIT datapackage.json from the built Parquet ───────────────────────
  # finetype types every column nominations.finetype.json does not declare;
  # descriptor.overrides.json overlays the curated half (identity, licenses, sources,
  # per-field prose, primaryKey, the code-list declaration). Hard-fails on drift.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/hts.parquet
      overrides: descriptor.overrides.json
      nominations: nominations.finetype.json
      out: datapackage.json

  # ── Contract: hold the Parquet to the shared code-list columns ───────────────────
  # scripts/check_code_list.py reads the built file and refuses one that breaks the
  # contract (a parent that is missing or not one level up, a depth that is not the
  # level's position, a repeated or empty code). The script is addressed by its
  # bytes, so editing it is a manifest edit as well:
  # `shasum -a 256 scripts/check_code_list.py` prints the digest. duckdb is pinned to
  # DUCKDB_VERSION in .github/workflows/descriptors.yml — keep the two in step.
  - name: check_code_list
    op: uv@1
    with:
      script: ../../scripts/check_code_list.py
      sha256: a6d4fd3c42aca53591f7f94bfef625f9c4f503b2d4331b64bea8103db88f7102
      deps:
        - duckdb==1.5.5
      args:
        - --parquet
        - build/hts.parquet
        - --levels
        - chapter,heading,subheading,tariff_line,statistical_line
        - --json
        - build/code_list_check.json
      reads:
        - build/hts.parquet
      # uv@1 must name what it writes. The check writes nothing else, and fails the run
      # (exit 1) on a broken contract; its findings go to this file.
      produces:
        - build/code_list_check.json

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ──
  # finetype_validate (CHECK-ONLY) checks the terminal Parquet against
  # schema.finetype.json; writes nothing, so build/hts.parquet is untouched.
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/hts.parquet
      schema: schema.finetype.json

  # ── Self-describe: put the descriptor INSIDE the Parquet it describes ───────────
  # As NAICS's does: the object answers for itself from its URL alone, the embedded
  # copy omits the resource `bytes` and `hash` and the package's `created`, and the
  # step runs last because it embeds the FINISHED descriptor.
  #
  # `op: uv@1` rather than a bare `python3`: the readback imports duckdb, and a
  # `python3` without it failed the step. uv resolves the interpreter and the package
  # itself. It rewrites, in place, the Parquet `export_hts` wrote and the
  # datapackage.json `describe` wrote, so each of those files has two writers; giving
  # each one writer, as edgar_gleif and the code lists do, is a separate restructure.
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      # `shasum -a 256 scripts/stamp_descriptor.py` prints this.
      sha256: a9356ac8d5412d94a940ebeef1e2508eaed6b77f1d923ada88edbacccf9d9b81
      # Pinned to DUCKDB_VERSION in .github/workflows/descriptors.yml. The stamp
      # rewrites no data page, so this need not be the DuckDB that wrote the Parquet.
      deps:
        - duckdb==1.5.5
      args:
        - stamp
        - --descriptor
        - datapackage.json
        - --parquet
        - build/hts.parquet
      reads:
        - datapackage.json
        - build/hts.parquet
      produces:
        - datapackage.json
        - build/hts.parquet

  # publish: the out-of-repo publish pipeline reads build/hts.parquet + the emitted
  # datapackage.json (boundary — not an arc step). See README.
