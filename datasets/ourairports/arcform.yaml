# The `ourairports` Protocol — the reproducible *definition* of how OurAirports' airports
# that carry an ICAO code are ingested: one row per ICAO code, with OurAirports' fields and
# its country and region names. `arc run` executes this manifest; one Run → one Dataset
# version. See ./README.md.
#
# CONFIG ONLY. Every step is a first-class `sql:` model or a typed `op:` operator (the
# arcform catalog). The fetches are http_fetch; the SQL reads OurAirports' CSVs into one
# row per ICAO code and adds the search corpus; the COPY is parquet_export;
# datapackage_describe emits the descriptor; check_code_list holds the Parquet to the
# shared code-list contract; finetype_validate gates it; and stamp_descriptor writes the
# published Parquet with its descriptor in the footer. Operator code lives in the arcform
# repo, not here.
#
# TESTS. tests.yaml beside this file holds the Protocol's tests, which `arc test` runs
# against the cut-down OurAirports files in testdata/, with no network and no publish.
#
# ONE WRITER PER FILE. The export and describe work on build/stage/; stamp_descriptor
# alone writes the published build/ourairports.parquet and datapackage.json.
#
# THE RELEASE. OurAirports' files carry no date. Two fetches of the data repository's
# latest commit on main, from GitHub's API, bracket the three data fetches: load.sql
# fails the run if the two name different commits, and `release` is the commit's UTC
# date. The data files come from raw.githubusercontent.com, which serves the branch the
# API names.
#
# IATA. iata_code and keywords are read only to check the header; load.sql drops them,
# so IATA's code list is not republished. See the model's header.
#
# PUBLISH. The last step, `publish` (ducklake_write), writes the table into the shared
# open lake as one snapshot: the catalog, the data file and the table's readable Parquet
# copy on R2 (public at https://openlake.meridian.online/). With all three R2 variables
# set, from .env or the environment, EVERY `arc run` publishes into the live lake;
# `arc run --publish` only makes a missing credential fail the run instead of publishing
# into build/lake/. For local work keep .env absent and the variables unset. Keep the
# credential outside this folder and export it for the publishing command only. Readers
# need DuckDB 2.0 or later. It reads only what stamp_descriptor wrote, so it runs after it.
#
# Produces: build/ourairports.parquet  →  published as library/ourairports
name: ourairports
engine: duckdb
# Kept in step with ../soc_2018, which pins the DuckDB that arc links (2.0), the writer of its published Parquet.
engine_version: ">=2.0"
db: build/ourairports.db
# The R2 write credential, if a .env is present (see .env.example); the process environment also counts.
dotenv: [.env]

defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: the release bracket around OurAirports' three files ──────────────────
  # The latest commit on the data repository's main branch, before and after the data.
  - name: fetch_release_before
    op: http_fetch@1
    with:
      url: https://api.github.com/repos/davidmegginson/ourairports-data/commits?sha=main&per_page=1
      out: build/ourairports/release_before.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"
        Accept: "application/vnd.github+json"

  - name: fetch_airports
    op: http_fetch@1
    depends_on: [build/ourairports/release_before.json]
    with:
      url: https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv
      out: build/ourairports/airports.csv
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  - name: fetch_countries
    op: http_fetch@1
    depends_on: [build/ourairports/release_before.json]
    with:
      url: https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/countries.csv
      out: build/ourairports/countries.csv
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  - name: fetch_regions
    op: http_fetch@1
    depends_on: [build/ourairports/release_before.json]
    with:
      url: https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/regions.csv
      out: build/ourairports/regions.csv
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  - name: fetch_release_after
    op: http_fetch@1
    depends_on: [build/ourairports/airports.csv, build/ourairports/countries.csv, build/ourairports/regions.csv]
    with:
      url: https://api.github.com/repos/davidmegginson/ourairports-data/commits?sha=main&per_page=1
      out: build/ourairports/release_after.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"
        Accept: "application/vnd.github+json"

  # ── Load: one row per ICAO code, its fields, names and release ──────────────────
  # Fails the run on a changed header, a commit that changed during the fetch, or a row
  # load refuses. See the model's header.
  - name: load
    sql: models/load.sql
    depends_on:
      - build/ourairports/release_before.json
      - build/ourairports/airports.csv
      - build/ourairports/countries.csv
      - build/ourairports/regions.csv
      - build/ourairports/release_after.json
    produces: [ourairports]

  # ── Package: materialise the terminal table (adds the search corpus) ────────────
  - name: package
    sql: models/package.sql
    produces: [ourairports_out]

  # ── Export: write the Parquet the later steps read ──────────────────────────────
  # order_by code (the primary key) is a total order → reproducible bytes.
  - name: export_ourairports
    op: parquet_export@1
    with:
      input: ourairports_out
      dest: build/stage/ourairports.parquet
      compression: zstd
      order_by: "code"

  # ── Describe: EMIT the descriptor from the built Parquet ────────────────────────
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/stage/ourairports.parquet
      overrides: descriptor.overrides.json
      nominations: nominations.finetype.json
      out: build/stage/described.json

  # ── Contract: hold the Parquet to the shared code-list columns ──────────────────
  # The script is addressed by its bytes, so editing it is a manifest edit as well:
  # `shasum -a 256 scripts/check_code_list.py` prints the digest. duckdb is pinned to
  # the same version as the stamp step below, which engine_version above names.
  - name: check_code_list
    op: uv@1
    with:
      script: ../../scripts/check_code_list.py
      sha256: a6d4fd3c42aca53591f7f94bfef625f9c4f503b2d4331b64bea8103db88f7102
      deps:
        - duckdb==2.0.0
      args:
        - --parquet
        - build/stage/ourairports.parquet
        - --levels
        - airport
        - --json
        - build/code_list_check.json
      reads:
        - build/stage/ourairports.parquet
      produces:
        - build/code_list_check.json

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ─
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/stage/ourairports.parquet
      schema: schema.finetype.json

  # ── Self-describe: write the published Parquet with its descriptor inside ───────
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      sha256: a9356ac8d5412d94a940ebeef1e2508eaed6b77f1d923ada88edbacccf9d9b81
      deps:
        - duckdb==2.0.0
      args:
        - stamp
        - --descriptor
        - build/stage/described.json
        - --parquet
        - build/stage/ourairports.parquet
        - --out
        - build/ourairports.parquet
        - --out-descriptor
        - datapackage.json
        - --carry-created
      reads:
        - build/stage/described.json
        - build/stage/ourairports.parquet
      produces:
        - build/ourairports.parquet
        - datapackage.json

  # ── Publish: the table into the open lake, one snapshot ─────────────────────────
  # Runs on every `arc run`. With R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID
  # all set, every run publishes live; otherwise into build/lake/, and `arc run --publish`
  # fails instead.
  - name: publish
    op: ducklake_write@1
    with:
      public_base: https://openlake.meridian.online/
      catalog: catalog/open.ducklake
      data_path: lake/
      runs: runs/
      manifest: manifest.json
      local_catalog: build/lake/open.ducklake
      tables:
        - table: library.ourairports
          from: build/ourairports.parquet
          descriptor: datapackage.json
          readable_copy: library/ourairports.parquet
      credential:
        type: r2
        bucket: meridian-open
        env:
          key_id: R2_ACCESS_KEY_ID
          secret: R2_SECRET_ACCESS_KEY
          account_id: R2_ACCOUNT_ID
