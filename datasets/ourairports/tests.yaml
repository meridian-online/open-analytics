    fetch_regions: testdata/regions.csv
    fetch_release_after: testdata/commit.json
  break:
    fetch_release_before: "UPDATE fixture SET \"commit\" = {'committer': {'date': '16 Nov 2026'}, 'tree': {'sha': 'ee87e71bbdb10202770287846e8604c267380c80'}}"
    fetch_release_after: "UPDATE fixture SET \"commit\" = {'committer': {'date': '16 Nov 2026'}, 'tree': {'sha': 'ee87e71bbdb10202770287846e8604c267380c80'}}"
  expect:
    fails_with: "commit date does not parse"

- name: a tree that is not the commit's is refused
  risk: GitHub's API cache answers the tree from one moment and the commit from another, and files are checked against the wrong commit
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_release_before: testdata/commit.json
    fetch_tree: testdata/tree.json
    fetch_airports: testdata/airports.csv
    fetch_countries: testdata/countries.csv
    fetch_regions: testdata/regions.csv
    fetch_release_after: testdata/commit.json
  break:
    fetch_release_before: "UPDATE fixture SET \"commit\" = {'committer': {'date': '2026-11-16T02:53:14Z'}, 'tree': {'sha': '437dbde2bc7423864f5e0e7f521db0fb23fef704'}}"
    fetch_release_after: "UPDATE fixture SET \"commit\" = {'committer': {'date': '2026-11-16T02:53:14Z'}, 'tree': {'sha': '437dbde2bc7423864f5e0e7f521db0fb23fef704'}}"
  expect:
    fails_with: "the fetched tree is not the tree of commit 1cdbf9cbed1e47bed8f115ec173b91aeb999e44f"

- name: a tree whose other entries differ from the commit's is refused
  risk: the tree's three files match but it is not the commit's tree, so the check rests on a tree from another moment
