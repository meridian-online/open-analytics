# The `cms/hcpcs` Protocol — the reproducible *definition* of how HCPCS Level II, the
# codes the Centers for Medicare & Medicaid Services maintain for billing supplies,
# drugs and services, is ingested from CMS's quarterly alpha-numeric file. `arc run`
# executes this manifest; one Run → one Dataset version. See ./README.md.
#
# CONFIG ONLY. Every step is a first-class `sql:` model or a typed `op:` operator (the
# arcform catalog). The fetch is http_fetch and the unzip archive_extract; date_hcpcs
# (uv) reads the codes file's date from the zip's directory; the SQL reads CMS's
# fixed-width file into one row per code and adds the search corpus; the
# COPY is parquet_export; check_licence proves the file carries no dental (CDT) code
# and no CPT content; datapackage_describe emits the descriptor; check_code_list holds
# the Parquet to the shared code-list contract; finetype_validate gates it; and
# stamp_descriptor writes the published Parquet with its descriptor in the footer.
# Operator code lives in the arcform repo, not here.
#
# ONE WRITER PER FILE. The export, the licence check and describe work on
# build/stage/; stamp_descriptor alone writes the published build/hcpcs.parquet and
# datapackage.json.
#
# THE QUARTER. CMS publishes each quarter's file at its own URL
# (/files/zip/<month>-<year>-alpha-numeric-hcpcs-file.zip), and the text file inside
# is named for the quarter (HCPC2027_JAN_ANWEB.txt). Up to October 2026 the name also
# carried the date CMS built the file; from January 2027 it does not, so the date comes
# from the zip's own directory, as Schedule B's does. arc does not substitute a param
# into an operator's `with:`, so a new quarter changes the URL in fetch_hcpcs and the
# member in extract_hcpcs, date_hcpcs and load's depends_on, and the quarter's source
# in descriptor.overrides.json; scripts/test_hcpcs_models.py fails when they disagree.
# `release` is read in load.sql from the member's name and its recorded date, so it
# cannot disagree with the file it was built from.
#
# PUBLISH. The last step, `publish` (ducklake_write), writes the table into the shared
# open lake as one snapshot: the catalog, the data file and the table's readable Parquet
# copy on R2 (public at https://openlake.meridian.online/). With all three R2 variables
# set, from .env or the environment, EVERY `arc run` publishes into the live lake;
# `arc run --publish` only makes a missing credential fail the run instead of publishing
# into build/lake/. For local work keep .env absent and the variables unset. Keep the
# credential outside this folder and export it for the publishing command only. Readers
# need DuckDB 2.0 or later. It reads only what stamp_descriptor wrote, so it runs after it.
#
# Produces: build/hcpcs.parquet  →  published as cms/hcpcs
name: hcpcs
engine: duckdb
# Kept in step with ../soc_2018, which pins the DuckDB that arc links (2.0), the writer of its published Parquet.
engine_version: ">=2.0"
db: build/hcpcs.db
# The R2 write credential, if a .env is present (see .env.example); the process environment also counts.
dotenv: [.env]

defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: CMS's alpha-numeric HCPCS file for the quarter, and the codes in it ──
  - name: fetch_hcpcs
    op: http_fetch@1
    with:
      url: https://www.cms.gov/files/zip/january-2027-alpha-numeric-hcpcs-file.zip
      out: build/hcpcs.zip
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # The zip also holds an Excel copy, CMS's record layout, a transaction report, a
  # corrections list, the not-otherwise-classified codes and the processing notes;
  # only the fixed-width codes file is read.
  - name: extract_hcpcs
    op: archive_extract@1
    with:
      archive: build/hcpcs.zip
      members: [HCPC2027_JAN_ANWEB.txt]
      dest: build/hcpcs

  # ── Date: the codes file's date, as the zip records it ──────────────────────────
  # archive_extract does not set a member's date on the file it writes, so the date
  # `release` carries is read from the zip's own directory. The script is shared with
  # ../schedule_b and addressed by its bytes: `shasum -a 256 scripts/member_date.py`
  # prints this. It needs only the standard library, so the step declares no `deps:`.
  - name: date_hcpcs
    op: uv@1
    with:
      script: ../../scripts/member_date.py
      sha256: 98a42fee4c99e3eee02881ed21368034e725f1609333faa73c0e46a721bd456c
      args:
        - --archive
        - build/hcpcs.zip
        - --member
        - HCPC2027_JAN_ANWEB.txt
        - --out
        - build/hcpcs_date.json
      reads:
        - build/hcpcs.zip
      produces:
        - build/hcpcs_date.json

  # ── Load: one row per code, its text, its CMS fields and its release ────────────
  # Drops the D series and every CPT code, and fails the run on a record it cannot
  # read. See the model's header.
  - name: load
    sql: models/load.sql
    depends_on: [build/hcpcs/HCPC2027_JAN_ANWEB.txt, build/hcpcs_date.json]

  # ── Package: materialise the terminal table (adds the search corpus) ────────────
  - name: package
    sql: models/package.sql
    produces: [hcpcs_out]

  # ── Export: write the Parquet the later steps read ──────────────────────────────
  # order_by code (the primary key) is a total order → reproducible bytes.
  - name: export_hcpcs
    op: parquet_export@1
    with:
      input: hcpcs_out
      dest: build/stage/hcpcs.parquet
      compression: zstd
      order_by: "code"

  # ── Licence: no dental (CDT) code and no CPT content in the exported file ───────
  - name: check_licence
    sql: models/check_licence.sql
    depends_on: [build/stage/hcpcs.parquet]
    produces: [licence_check]

  # ── Describe: EMIT the descriptor from the built Parquet ────────────────────────
  # finetype types every column nominations.finetype.json does not declare;
  # descriptor.overrides.json overlays the curated half (identity, licenses, sources,
  # per-field prose, primaryKey, the code-list declaration). Hard-fails on drift.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/stage/hcpcs.parquet
      overrides: descriptor.overrides.json
      nominations: nominations.finetype.json
      out: build/stage/described.json

  # ── Contract: hold the Parquet to the shared code-list columns ──────────────────
  # The script is addressed by its bytes, so editing it is a manifest edit as well:
  # `shasum -a 256 scripts/check_code_list.py` prints the digest. duckdb is pinned to
  # the same version as the stamp step below, which engine_version above names.
  - name: check_code_list
    op: uv@1
    with:
      script: ../../scripts/check_code_list.py
      sha256: a6d4fd3c42aca53591f7f94bfef625f9c4f503b2d4331b64bea8103db88f7102
      deps:
        - duckdb==2.0.0
      args:
        - --parquet
        - build/stage/hcpcs.parquet
        - --levels
        - code
        - --json
        - build/code_list_check.json
      reads:
        - build/stage/hcpcs.parquet
      produces:
        - build/code_list_check.json

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ─
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/stage/hcpcs.parquet
      schema: schema.finetype.json

  # ── Self-describe: write the published Parquet with its descriptor inside ───────
  # The object answers for itself from its URL alone; the embedded copy omits the
  # resource `bytes` and `hash` and the package's `created`. It runs last because it
  # embeds the FINISHED descriptor.
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      sha256: a9356ac8d5412d94a940ebeef1e2508eaed6b77f1d923ada88edbacccf9d9b81
      deps:
        - duckdb==2.0.0
      args:
        - stamp
        - --descriptor
        - build/stage/described.json
        - --parquet
        - build/stage/hcpcs.parquet
        - --out
        - build/hcpcs.parquet
        - --out-descriptor
        - datapackage.json
        - --carry-created
      reads:
        - build/stage/described.json
        - build/stage/hcpcs.parquet
      produces:
        - build/hcpcs.parquet
        - datapackage.json

  # ── Publish: the table into the open lake, one snapshot ─────────────────────────
  # Runs on every `arc run`. With R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID
  # all set, every run publishes live; otherwise into build/lake/, and `arc run --publish`
  # fails instead.
  - name: publish
    op: ducklake_write@1
    with:
      public_base: https://openlake.meridian.online/
      catalog: catalog/open.ducklake
      data_path: lake/
      runs: runs/
      manifest: manifest.json
      local_catalog: build/lake/open.ducklake
      tables:
        - table: cms.hcpcs
          from: build/hcpcs.parquet
          descriptor: datapackage.json
          readable_copy: cms/hcpcs.parquet
      credential:
        type: r2
        bucket: meridian-open
        env:
          key_id: R2_ACCESS_KEY_ID
          secret: R2_SECRET_ACCESS_KEY
          account_id: R2_ACCOUNT_ID
