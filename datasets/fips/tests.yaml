# The census/fips Protocol's tests, run by `arc test` from this folder (see README.md).
#
# Fixtures, in testdata/ (see testdata/README.md): cut-down copies of Census's three
# files, keeping seven states and their counties. The ANSI and Gazetteer files are
# pipe-delimited text; their fixtures are named .csv so a break can rewrite them, and
# arc places each at the .txt path the fetch writes. gazetteer.zip holds the Gazetteer
# fixture under Census's member name, so the pass case runs extract_gazetteer itself; a
# test that breaks the Gazetteer gives extract_gazetteer its own fixture as well.
#
# Expected in the fixture: 7 states and 31 counties, 22 from the ANSI list and Connecticut's
# 9 planning regions from the Gazetteer.
#
# check_code_list is a uv step, so a refusal of its own could be matched only by
# "step 'check_code_list' failed (exit code n)"; the contract it holds is tested by
# scripts/test_check_code_list.py, and the pass case shows this table meets it.
#
# The lake: every test gives emit_descriptors testdata/lake_descriptors.json, the open
# lake's descriptors as `python scripts/emit_descriptor.py --all --bundle` emitted them,
# so no test reads the network. check_before_publish holds the build against that bundle.
# finetype infers a descriptor from the rows it reads, and on the fixture's rows it labels
# some columns differently from the lake's descriptor of the full table (depth as a
# boolean, gnis_code as a date), so the label check would fail on the fixture's own
# descriptor. The tests that run describe on the fixture therefore give
# check_before_publish its fixture too, a stand-in report, and "a build carrying the
# lake's descriptor passes the check before publish" runs the check for real: describe's
# fixture there is the lake's own descriptor of this table, testdata/described.json, which
# the stamp writes into the Parquet built from the fixture.
#
# check_before_publish is a uv step that prints its findings on standard output, which arc
# does not report, so its refusal is matched by "step 'check_before_publish' failed (exit
# code 1)", exit 1 being a finding rather than a check that could not run. The refusal
# case differs from the case before it only in the bundle, so that pair shows the bundle
# is what fails it; it is an end-to-end case and cannot say which finding. Relabelling
# naics.level also leaves reasons that pin it stale, so scripts/test_check_before_publish.py
# shows a label disagreement failing on its own, by the report's text, with no reason
# shipped. The disagreement is a second fixture file, not a break: arc reads a JSON
# fixture as an array or as one object per line, and the bundle is one object over many
# lines, which DuckDB refuses as malformed.

- name: the fixture builds the code list
  risk: a FIPS table published with Connecticut's codes, the Island Areas or the current flag wrong
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    check_before_publish: testdata/check_before_publish.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
  checks:
    # Row counts by level, source and current.
    - >-
      SELECT level, text_source, current, count(*) AS n FROM fips_out GROUP BY ALL
      EXCEPT
      SELECT * FROM (VALUES ('state', 'census_ansi', true, 5), ('state', 'census_ansi', NULL, 2),
        ('county', 'census_ansi', true, 8), ('county', 'census_ansi', false, 8),
        ('county', 'census_ansi', NULL, 6), ('county', 'census_gazetteer', true, 9))
    - SELECT * FROM (SELECT count(*) AS n FROM fips_out) WHERE n <> 38
    # Connecticut's eight old counties are not current; its nine planning regions are.
    - >-
      SELECT code FROM fips_out WHERE state_code = '09' AND level = 'county'
        AND ((code BETWEEN '09001' AND '09015') IS DISTINCT FROM (current IS NOT DISTINCT FROM false))
    - >-
      SELECT code FROM fips_out WHERE code BETWEEN '09110' AND '09190'
        AND (text_source <> 'census_gazetteer' OR class_code IS NOT NULL
             OR functional_status IS NOT NULL OR county_code IS DISTINCT FROM substr(code, 3, 3))
    # The Island Areas and Minor Outlying Islands are outside the Gazetteer: current is NULL.
    - SELECT code FROM fips_out WHERE state_code IN ('60', '74') AND current IS NOT NULL
    # The release names both vintages, on every row.
    - SELECT DISTINCT release FROM fips_out WHERE release IS DISTINCT FROM 'ANSI 2020, Gazetteer 2026'
    # Shapes and parents.
    - >-
      SELECT code FROM fips_out
      WHERE (level = 'state' AND (length(code) <> 2 OR parent_code IS NOT NULL OR county_code IS NOT NULL
                                  OR depth IS DISTINCT FROM 0 OR state_code IS DISTINCT FROM code))
         OR (level = 'county' AND (length(code) <> 5 OR parent_code IS DISTINCT FROM substr(code, 1, 2)
                                   OR depth IS DISTINCT FROM 1 OR state_code IS DISTINCT FROM parent_code))
    - >-
      SELECT code FROM fips_out WHERE parent_code IS NOT NULL
        AND parent_code NOT IN (SELECT code FROM fips_out WHERE level = 'state')
    # Text: an accented name kept, the full name in context, the corpus stripped.
    - >-
      SELECT * FROM fips_out WHERE code = '35013'
        AND (description IS DISTINCT FROM 'Doña Ana County'
             OR description_full IS DISTINCT FROM 'New Mexico › Doña Ana County'
             OR corpus IS DISTINCT FROM 'new mexico › dona ana county')
    - SELECT code FROM fips_out WHERE code = '60020' AND description IS DISTINCT FROM 'Manu''a District'
    # The rows the checks below name must exist.
    - >-
      SELECT * FROM (VALUES ('01001'), ('11'), ('35013'), ('60020')) v(code)
      WHERE code NOT IN (SELECT code FROM fips_out)
    # Census's own fields carried through.
    - >-
      SELECT * FROM fips_out WHERE code = '01001'
        AND (state_abbr IS DISTINCT FROM 'AL' OR gnis_code IS DISTINCT FROM '00161526'
             OR class_code IS DISTINCT FROM 'H1' OR functional_status IS DISTINCT FROM 'A'
             OR current IS NOT true)
    - SELECT code FROM fips_out WHERE code = '11' AND (state_abbr IS DISTINCT FROM 'DC' OR gnis_code IS DISTINCT FROM '01702382')

- name: a county only the Gazetteer lists is added
  risk: Census adds a county-equivalent in a later vintage and the table leaves it out, so current data fails to join
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    check_before_publish: testdata/check_before_publish.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
    extract_gazetteer: testdata/gazetteer_counties.csv
  break:
    extract_gazetteer: >-
      INSERT INTO fixture SELECT 'AL', '01999', '0500000US01999', '09999999', 'Test County',
        '1', '1', '1', '1', '1', '1'
  checks:
    - >-
      SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM fips_out WHERE code = '01999'
        AND text_source = 'census_gazetteer' AND current AND description_full = 'Alabama › Test County')

- name: a changed state header is refused
  risk: Census reorders or renames the state file's columns and names or codes load into the wrong fields
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
  break:
    fetch_states: ALTER TABLE fixture RENAME COLUMN STATE_NAME TO NAME
  expect:
    fails_with: "ANSI state header has changed"

- name: a changed Gazetteer header is refused
  risk: Census changes the Gazetteer's columns and its GNIS codes or names are read from the wrong field
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
    extract_gazetteer: testdata/gazetteer_counties.csv
  break:
    extract_gazetteer: ALTER TABLE fixture RENAME COLUMN ANSICODE TO GNIS
  expect:
    fails_with: "Gazetteer header has changed"

- name: a malformed county code is refused
  risk: a county code that lost its leading zeros publishes as a key nothing joins to
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
  break:
    fetch_counties: UPDATE fixture SET COUNTYFP = '1' WHERE STATEFP = '01' AND COUNTYFP = '001'
  expect:
    fails_with: "ANSI county code is not three digits"

- name: a county whose state is missing is refused
  risk: counties publish under a parent code the table does not hold
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
  break:
    fetch_states: DELETE FROM fixture WHERE STATEFP = '35'
  expect:
    fails_with: "county whose state is not in the ANSI state file: 35001"

- name: a county renamed in the Gazetteer is refused
  risk: a county renamed in a later vintage publishes under its old ANSI name without anyone deciding which is right
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
    extract_gazetteer: testdata/gazetteer_counties.csv
  break:
    extract_gazetteer: UPDATE fixture SET NAME = 'Autauga Parish' WHERE GEOID = '01001'
  expect:
    fails_with: "county name differs between the ANSI and Gazetteer files: 01001"

- name: a GNIS code that differs between the files is refused
  risk: a county publishes with a GNIS code one of Census's own files contradicts
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
    extract_gazetteer: testdata/gazetteer_counties.csv
  break:
    extract_gazetteer: UPDATE fixture SET ANSICODE = '00000000' WHERE GEOID = '01003'
  expect:
    fails_with: "county GNIS code differs between the ANSI and Gazetteer files: 01003"

- name: a county abbreviation that differs from its state's is refused
  risk: county rows publish a state abbreviation that contradicts their own state's row
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
  break:
    fetch_counties: UPDATE fixture SET STATE = 'AK' WHERE STATEFP = '01' AND COUNTYFP = '003'
  expect:
    fails_with: "county state abbreviation differs from the ANSI state file: 01003"

- name: a Gazetteer county whose state is missing is refused
  risk: a county only the Gazetteer lists publishes under a state the table does not hold
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
    extract_gazetteer: testdata/gazetteer_counties.csv
  break:
    extract_gazetteer: >-
      INSERT INTO fixture SELECT 'ZZ', '99001', '0500000US99001', '09999998', 'Nowhere County',
        '1', '1', '1', '1', '1', '1'
  expect:
    fails_with: "county whose state is not in the ANSI state file: 99001"

- name: a build carrying the lake's descriptor passes the check before publish
  risk: a table whose descriptor agrees with the lake is refused before publish, or the check is never run
  fixtures:
    emit_descriptors: testdata/lake_descriptors.json
    describe: testdata/described.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip

- name: a sibling code list that labels a shared field differently is refused before publish
  risk: census/fips publishes beside a code list that labels the same field another way, and nothing says so
  fixtures:
    # census/naics_2022's level labelled representation.text.plain_text; fips.level is
    # representation.text.word.
    emit_descriptors: testdata/lake_descriptors_disagreeing.json
    describe: testdata/described.json
    fetch_states: testdata/national_state.csv
    fetch_counties: testdata/national_county.csv
    fetch_gazetteer: testdata/gazetteer.zip
  expect:
    fails_with: "step 'check_before_publish' failed (exit code 1)"
